<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXE NET</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,rgba(255,181,46,.14),transparent 34%),linear-gradient(180deg,#050505 0%,#111 45%,#070707 100%);color:#fff;font-family:Arial,sans-serif}

#loadingScreen{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at top,rgba(255,181,46,.16),transparent 35%),#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s ease,visibility .35s ease}
#loadingScreen.hide{opacity:0;visibility:hidden}
.loading-logo{width:120px;height:120px;border-radius:24px;border:1px solid rgba(255,181,46,.35);background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:14px;animation:pulseLogo 1.4s ease-in-out infinite}
.loading-logo img{max-width:100%;max-height:100%;object-fit:contain}
.loading-title{margin-top:20px;font-size:28px;font-weight:950;color:#ffb52e;letter-spacing:1px}
.loading-text{margin-top:8px;font-size:13px;color:#aaa;letter-spacing:.4px}
@keyframes pulseLogo{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(255,181,46,0)}50%{transform:scale(1.04);box-shadow:0 0 34px rgba(255,181,46,.22)}}

.wrap{max-width:1280px;margin:auto;padding:28px 18px 50px}
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:22px;min-height:184px;padding:30px 34px;margin-bottom:18px;border-radius:24px;border:1px solid rgba(255,181,46,.2);background:linear-gradient(135deg,rgba(255,181,46,.13),rgba(255,255,255,.025)),#101010;cursor:pointer;transition:.22s ease}
.hero>*{position:relative;z-index:2}
.hero::after{content:"AXE";position:absolute;right:34px;top:50%;transform:translateY(-50%);z-index:0;font-size:112px;font-weight:950;color:rgba(255,255,255,.035);letter-spacing:9px;line-height:1;pointer-events:none;animation:heroWatermarkFloat 5.5s ease-in-out infinite}
.hero::before{content:"NETWORK";position:absolute;right:42px;bottom:26px;z-index:1;font-size:14px;font-weight:950;color:rgba(255,181,46,.22);letter-spacing:6px;pointer-events:none}
.hero-shine{position:absolute!important;inset:-80px auto -80px -35%;z-index:1!important;width:32%;background:linear-gradient(90deg,transparent,rgba(255,181,46,.08),rgba(255,255,255,.08),transparent);transform:skewX(-18deg);animation:heroShine 5.8s ease-in-out infinite;pointer-events:none}
@keyframes heroWatermarkFloat{0%,100%{transform:translateY(-50%) translateX(0);opacity:1}50%{transform:translateY(-52%) translateX(-8px);opacity:.82}}
@keyframes heroShine{0%{left:-45%;opacity:0}18%{opacity:1}42%{left:115%;opacity:0}100%{left:115%;opacity:0}}
.hero:hover{transform:translateY(-2px);border-color:rgba(255,181,46,.45);box-shadow:0 16px 45px rgba(0,0,0,.35)}
.logo-box{width:128px;height:128px;border-radius:22px;background:rgba(0,0,0,.35);border:1px solid rgba(255,181,46,.2);display:flex;align-items:center;justify-content:center;padding:12px}
.logo-box img{max-width:100%;max-height:100%;object-fit:contain}
.kicker{color:#ffb52e;font-size:13px;font-weight:800;letter-spacing:1.4px;margin-bottom:8px}
h1{margin:0;font-size:42px;font-weight:950;letter-spacing:.5px}
.sub{margin-top:10px;color:#c4c4c4;font-size:15px;line-height:1.6}

.main-menu-shell{position:relative;margin:0 0 18px}
.main-menu{display:flex;align-items:center;gap:0;margin:0;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),rgba(5,5,5,.88);overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.22)}
.main-menu button{position:relative;min-width:112px;height:46px;background:transparent;color:#cfcfcf;border:0;border-right:1px solid rgba(255,255,255,.06);cursor:pointer;font-size:15px;font-weight:900;letter-spacing:.1px;transition:.22s ease}
.main-menu button:last-child{border-right:0}
.main-menu button::before{content:"";position:absolute;left:18px;right:18px;bottom:0;height:3px;background:#ffb52e;transform:scaleX(0);transform-origin:center;transition:.22s ease}
.main-menu button::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,181,46,.12),transparent);opacity:0;transition:.22s ease}
.main-menu button:hover{color:#fff;transform:translateY(-1px)}
.main-menu button:hover::after{opacity:1}
.main-menu button:hover::before{transform:scaleX(.55)}
.main-menu button.active{color:#ffb52e;background:rgba(255,181,46,.08)}
.main-menu button.active::before{transform:scaleX(1)}

.info-menu,.sub-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.info-menu button,.sub-filter button,.back-btn,.tube-submit-open{background:rgba(20,20,20,.92);color:#bbb;border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:850;transition:.18s ease}
.info-menu button.active,.sub-filter button.active{color:#ffb52e;background:rgba(255,181,46,.1);border-color:rgba(255,181,46,.65)}
.outlaw-tabs{position:relative;align-items:center}
.outlaw-tabs button{position:relative;overflow:hidden}
.outlaw-tabs button.active{color:#ffb52e;background:rgba(255,181,46,.08);border-color:rgba(255,181,46,.65);box-shadow:none}
.outlaw-tabs button.active::after{display:none}
.outlaw-tabs button:hover{box-shadow:none}
.back-btn:hover,.info-menu button:hover,.sub-filter button:hover,.tube-submit-open:hover{color:#ffb52e;border-color:rgba(255,181,46,.45);transform:translateY(-1px)}

.panel{border:1px solid rgba(255,255,255,.08);background:rgba(12,12,12,.88);border-radius:22px;padding:22px}
.section-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}
.section-title{font-size:25px;font-weight:950}
.section-desc{color:#909090;font-size:13px;margin-top:5px}
.count{color:#ffb52e;background:rgba(255,181,46,.09);border:1px solid rgba(255,181,46,.25);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:850;white-space:nowrap}
.home-grid{display:grid;grid-template-columns:.85fr 1.4fr;gap:18px}
.home-card{border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.25);border-radius:18px;padding:16px}
.home-card-title{font-size:18px;font-weight:950;margin-bottom:12px;color:#ffb52e}

.notice-item{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;transition:transform .16s ease,background .16s ease}
.notice-item:last-child{border-bottom:none}
.notice-item:hover{background:rgba(255,181,46,.045);transform:translateX(6px)}
.notice-board-head{display:grid;grid-template-columns:1fr 130px 80px;gap:12px;padding:12px 16px;color:#888;font-size:12px;font-weight:900;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025)}
.notice-row{display:grid;grid-template-columns:1fr 130px 80px;gap:12px;align-items:center;padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;transition:.16s ease}
.notice-row:hover{background:rgba(255,181,46,.06);padding-left:22px}
.notice-row-title{font-size:15px;font-weight:900}
.notice-row-date,.notice-row-type{font-size:12px;color:#888}
.notice-detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.notice-detail-content{white-space:pre-line;line-height:1.75;font-size:15px;color:#ddd;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:18px}

.item-title{font-size:15px;font-weight:900}
.item-date{margin-top:5px;font-size:12px;color:#888}
.item-content{margin-top:6px;font-size:13px;color:#aaa;line-height:1.5}
.important{display:inline-block;margin-right:6px;color:#ff5d5d;font-weight:950}

/* 이하 코드가 너무 길어 다음 메시지에서 2/3 이어서 제공합니다 */
    .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);border-radius:15px;overflow:hidden;cursor:pointer;transition:.18s ease}
.card:hover{border-color:rgba(255,181,46,.45);background:rgba(255,181,46,.055);transform:translateY(-2px)}
.thumb{width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.thumb.square{aspect-ratio:4/3}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s ease}
.card:hover .thumb img{transform:scale(1.04)}
.card-body{padding:13px}
.card-title{font-size:15px;font-weight:950;color:#fff;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;color:#888;font-size:12px}

.tube-stat-badge,.badge{display:inline-flex;align-items:center;min-height:23px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#bbb;font-size:12px;font-weight:900}
.tube-stat-badge.like,.badge.like{color:#ffcf75;background:rgba(255,181,46,.1);border-color:rgba(255,181,46,.32)}
.tube-stat-badge.comment,.badge.comment{color:#c8adff;background:rgba(156,95,255,.16);border-color:rgba(156,95,255,.48)}

.board-head{display:grid;grid-template-columns:1fr 110px 100px 70px 70px;gap:12px;padding:12px 16px;color:#888;font-size:12px;font-weight:900;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025)}
.board-row{display:grid;grid-template-columns:1fr 110px 100px 70px 70px;gap:12px;align-items:center;padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;transition:.16s ease}
.board-row:hover{background:rgba(255,181,46,.06);padding-left:22px}
.board-title{font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.board-meta{font-size:12px;color:#888}

.detail-card{border:1px solid rgba(255,255,255,.08);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),rgba(0,0,0,.24);padding:22px}
.detail-title{font-size:28px;font-weight:950;color:#fff;line-height:1.25;margin-bottom:10px}
.detail-meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.detail-content{white-space:pre-line;line-height:1.72;font-size:15px;color:#ddd;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:18px}
.detail-video{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.1);margin:14px 0 16px}
.detail-video iframe{width:100%;height:100%;border:0}

.gallery-detail-images{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 16px}
.gallery-detail-images img,.map-img{width:100%;max-height:420px;object-fit:contain;background:#000;border:1px solid rgba(255,255,255,.1);border-radius:13px;cursor:zoom-in}

.reaction-area{display:flex;justify-content:center;gap:10px;margin:24px 0 18px}
.reaction-btn{height:42px;min-width:86px;padding:0 17px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);color:#d6d6d6;font-size:14px;font-weight:950;cursor:pointer;transition:.16s ease}
.reaction-btn:hover{transform:translateY(-1px)}
.reaction-btn.active.like{border-color:rgba(255,181,46,.68);background:rgba(255,181,46,.14);color:#ffcf75}
.reaction-btn.active.dislike{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.13);color:#e0e0e0}

.bottom-actions{display:flex;justify-content:space-between;gap:12px;margin:12px 0 8px}
.admin-actions{display:flex;gap:8px}
.btn{height:40px;padding:0 15px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:rgba(20,20,20,.92);color:#bbb;font-weight:950;cursor:pointer}
.btn:hover{color:#ffb52e;border-color:rgba(255,181,46,.45)}
.btn.danger:hover{color:#ff6b6b;border-color:rgba(255,107,107,.55)}

.comment-section{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
.comment-title{font-size:18px;font-weight:950;color:#ffb52e;margin-bottom:12px}
.comment-list{display:grid;gap:9px;margin-bottom:14px}
.comment-item{border:1px solid rgba(255,255,255,.075);background:rgba(0,0,0,.22);border-radius:13px;padding:12px 13px}
.comment-item.reply{margin-left:28px;background:rgba(156,95,255,.045);border-left:3px solid rgba(156,95,255,.42)}
.comment-meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px;color:#888;font-size:12px}
.comment-writer{color:#ffb52e;font-weight:950}
.comment-content{white-space:pre-line;line-height:1.55;color:#ddd;font-size:14px}
.comment-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.comment-btn{height:28px;padding:0 9px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);color:#aaa;cursor:pointer;font-size:12px;font-weight:900}
.comment-btn.active.like{color:#ffcf75;background:rgba(255,181,46,.13);border-color:rgba(255,181,46,.48)}
.comment-btn.active.dislike{color:#e0e0e0;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26)}

.comment-form,.reply-form{display:grid;grid-template-columns:140px 150px 1fr 96px;gap:8px;align-items:stretch}
.reply-form{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
.reply-form.active{display:grid}

.input,.textarea{border:1px solid rgba(255,255,255,.1);background:#151515;color:#fff;border-radius:12px;padding:11px;outline:none;font-family:Arial,sans-serif}
.textarea{min-height:44px;resize:vertical}
.submit{border:0;border-radius:12px;background:#ffb52e;color:#111;font-weight:950;cursor:pointer}

.form-modal,.image-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:14px;z-index:9999}
.form-modal.active,.image-modal.active{display:flex}

.form-box{width:min(560px,100%);background:#0d0d0d;border:1px solid rgba(255,181,46,.25);border-radius:18px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.55)}
.form-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.form-title{font-weight:950;color:#ffb52e}
.form-close{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:18px}
.form-body{padding:16px}
.form-label{font-size:12px;color:#aaa;margin:10px 0 6px;font-weight:850}
.form-input,.form-textarea{width:100%;border:1px solid rgba(255,255,255,.1);background:#151515;color:#fff;border-radius:12px;padding:12px;outline:none;font-family:Arial,sans-serif}
.form-textarea{min-height:110px;resize:vertical}
.form-submit{width:100%;height:44px;margin-top:14px;border:0;border-radius:12px;background:#ffb52e;color:#111;font-weight:950;cursor:pointer}
.form-help{font-size:12px;color:#888;line-height:1.5;margin-top:10px}

.image-modal{padding:18px;overflow:auto}
.image-modal-box{position:relative;display:inline-block;max-width:95vw;max-height:90vh}
.image-modal-box img{width:auto;height:auto;max-width:95vw;max-height:90vh;object-fit:contain;border-radius:10px;border:1px solid rgba(255,181,46,.35);background:#000;display:block}
.image-close{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.72);color:#fff;font-size:24px;font-weight:900;cursor:pointer}

.ready{padding:28px;color:#999;border:1px dashed rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.03)}

@media(max-width:980px){
.main-menu{overflow:auto}
.main-menu button{min-width:120px}
.card-grid{grid-template-columns:repeat(2,1fr)}
.home-grid{grid-template-columns:1fr}
}
@media(max-width:760px){
.wrap{padding:16px 10px 34px}
.hero{min-height:110px;padding:16px 14px;gap:12px}
.hero::after{font-size:52px;right:12px}
.logo-box{width:74px;height:74px;min-width:74px;border-radius:16px}
h1{font-size:27px}
.sub{font-size:12px}
.panel{padding:14px;border-radius:18px}
.section-head{display:block}
.section-title{font-size:21px}
.count{display:inline-block;margin-top:9px}
.card-grid{grid-template-columns:1fr}
.board-head,.notice-board-head{display:none}
.board-row,.notice-row{grid-template-columns:1fr;gap:5px}
.detail-card{padding:14px}
.detail-title{font-size:22px}
.gallery-detail-images{grid-template-columns:1fr}
.bottom-actions{display:grid;grid-template-columns:1fr}
.admin-actions{display:grid;grid-template-columns:1fr 1fr}
.comment-form,.reply-form.active{grid-template-columns:1fr}
.submit{height:42px}
.comment-meta{display:block}
.comment-actions{margin-top:8px}
.comment-item.reply{margin-left:8px}
}
</style>
</head>

<body>

<div id="loadingScreen">
    <div class="loading-logo">
        <img src="./axe.png" onerror="this.style.display='none'">
    </div>
    <div class="loading-title">AXE NET</div>
    <div class="loading-text">데이터 불러오는 중...</div>
</div>

<div class="wrap">

    <div class="hero" onclick="navigateMain('home')">
        <div class="hero-shine"></div>

        <div class="logo-box">
            <img src="./axe.png" alt="AXE 로고" onerror="this.style.display='none'">
        </div>

        <div class="hero-text">
            <div class="kicker">AXE COMPANY NETWORK</div>
            <h1>AXE NET</h1>
            <div class="sub">AXE 내부 운영 시스템</div>
        </div>
    </div>

    <div class="main-menu-shell">
        <div class="main-menu">
            <button class="active" onclick="navigateMain('home')">메인</button>
            <button onclick="navigateMain('notice')">공지사항</button>
            <button onclick="navigateMain('tube')">AXE TUBE</button>
            <button onclick="navigateMain('outlaw')">무법지대</button>
            <button onclick="navigateMain('board')">자유게시판</button>
            <button onclick="navigateMain('gallery')">갤러리</button>
            <button onclick="navigateMain('info')">정보</button>
            <button onclick="navigateMain('utility')">편의기능</button>
        </div>
    </div>

    <div class="panel" id="content"></div>

</div>

<!-- 이하 다음 메시지 3/3에서 이어짐 -->
    <div class="image-modal" id="imageModal" onclick="closeImageModal()">
    <div class="image-modal-box" onclick="event.stopPropagation()">
        <button class="image-close" onclick="closeImageModal()">×</button>
        <img id="imageModalImg" src="">
    </div>
</div>

<div class="form-modal" id="tubeFormModal" onclick="closeModalOutside(event,'tubeFormModal')">
    <div class="form-box">
        <div class="form-head">
            <div class="form-title">AXE TUBE 글쓰기</div>
            <button class="form-close" onclick="closeTubeForm()">×</button>
        </div>
        <div class="form-body">
            <div class="form-label">작성자</div>
            <input class="form-input" id="tubeWriter">

            <div class="form-label">영상 제목</div>
            <input class="form-input" id="tubeTitle">

            <div class="form-label">유튜브 링크</div>
            <input class="form-input" id="tubeUrl">

            <div class="form-label">썸네일 주소</div>
            <input class="form-input" id="tubeThumbnail">

            <div class="form-label">분류</div>
            <input class="form-input" id="tubeCategory" value="일반">

            <div class="form-label">내용</div>
            <textarea class="form-textarea" id="tubeContent"></textarea>

            <div class="form-label">삭제 비밀번호</div>
            <input class="form-input" id="tubePassword" type="password">

            <button class="form-submit" onclick="submitTubePost()">등록하기</button>
        </div>
    </div>
</div>

<div class="form-modal" id="boardFormModal" onclick="closeModalOutside(event,'boardFormModal')">
    <div class="form-box">
        <div class="form-head">
            <div class="form-title">자유게시판 글쓰기</div>
            <button class="form-close" onclick="closeBoardForm()">×</button>
        </div>

        <div class="form-body">
            <div class="form-label">작성자</div>
            <input class="form-input" id="boardWriter">

            <div class="form-label">제목</div>
            <input class="form-input" id="boardTitle">

            <div class="form-label">분류</div>
            <input class="form-input" id="boardCategory" value="일반">

            <div class="form-label">내용</div>
            <textarea class="form-textarea" id="boardContent"></textarea>

            <div class="form-label">삭제 비밀번호</div>
            <input class="form-input" id="boardPassword" type="password">

            <button class="form-submit" onclick="submitBoardPost()">등록하기</button>
        </div>
    </div>
</div>

<div class="form-modal" id="galleryFormModal" onclick="closeModalOutside(event,'galleryFormModal')">
    <div class="form-box">
        <div class="form-head">
            <div class="form-title">갤러리 글쓰기</div>
            <button class="form-close" onclick="closeGalleryForm()">×</button>
        </div>

        <div class="form-body">

            <div class="form-label">작성자</div>
            <input class="form-input" id="galleryWriter">

            <div class="form-label">제목</div>
            <input class="form-input" id="galleryTitle">

            <div class="form-label">분류</div>
            <input class="form-input" id="galleryCategory" value="일반">

            <div class="form-label">사진 업로드 (최대 5장)</div>
            <input class="form-input" id="galleryImages" type="file" accept="image/*" multiple>

            <div class="form-label">내용</div>
            <textarea class="form-textarea" id="galleryContent"></textarea>

            <div class="form-label">삭제 비밀번호</div>
            <input class="form-input" id="galleryPassword" type="password">

            <button class="form-submit" onclick="submitGalleryPost()">등록하기</button>

            <div class="form-help">
                사진은 구글 드라이브에 저장됩니다.
            </div>

        </div>
    </div>
</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbwl_e_JbXpqxSNp_q9-vtJGdSQqL2Z2TiQ8GjO8Ulrve3Pqta--A6yTvE0KTB3pUU1jSA/exec";

let notices=[];
let operations=[];
let tubes=[];
let tubeComments=[];
let boards=[];
let boardComments=[];
let galleries=[];
let galleryComments=[];
let briefingMaps=[];
let outlawGuides=[];
let crafts=[];
let materials=[];
let craftRanks=[];
let quests=[];
let processes=[];
let materialRecipes=[];
let modBooks=[];
let skillRanks=[];

function safe(v){
    return v===undefined||v===null||v===""?"-":escapeHtml(String(v));
}

function escapeHtml(text){
    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function js(v){
    return String(v||"")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\n/g,"\\n");
}

function formatDate(v){
    if(!v)return "-";
    const d=new Date(v);
    if(isNaN(d.getTime()))return safe(v);

    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}

function sortByRecent(list){
    return list.slice().sort((a,b)=>{
        const ao=Number(a.order||0)||999999;
        const bo=Number(b.order||0)||999999;

        if(ao!==bo)return ao-bo;

        return new Date(b.date||0)-new Date(a.date||0);
    });
}

function setMenu(index){
    document.querySelectorAll(".main-menu button").forEach((btn,i)=>{
        btn.classList.toggle("active",i===index);
    });
}

function hideLoading(){
    document.getElementById("loadingScreen").classList.add("hide");
}

function getYoutubeId(url){
    const m=String(url||"").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([^?&/]+)/);
    return m?m[1]:"";
}

function getTubeThumbnail(item){
    if(item.thumbnail)return item.thumbnail;
    const id=getYoutubeId(item.url);
    return id?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:"./axe.png";
}

function getGalleryImages(item){
    return String(item.image_url||"")
        .split(/\n|,/)
        .map(v=>v.trim())
        .filter(Boolean);
}

function openImageModal(src){
    document.getElementById("imageModalImg").src=src;
    document.getElementById("imageModal").classList.add("active");
}

function closeImageModal(){
    document.getElementById("imageModal").classList.remove("active");
    document.getElementById("imageModalImg").src="";
}

function closeModalOutside(event,id){
    if(event.target.id===id){
        document.getElementById(id).classList.remove("active");
    }
}

function postApi(payload){
    return fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(payload)
    }).then(r=>r.json());
}

function navigateMain(page){

    if(page==="home")showHome();
    if(page==="notice")showNotice();
    if(page==="tube")showTube();
    if(page==="outlaw")showOutlaw();
    if(page==="board")showBoard();
    if(page==="gallery")showGallery();
    if(page==="info")showInfo();
    if(page==="utility")showUtility();

}

function showHome(){

    setMenu(0);

    const recentTubes=sortByRecent(tubes).slice(0,6);
    const recentBoards=sortByRecent(boards).slice(0,5);
    const recentGallery=sortByRecent(galleries).slice(0,6);

    document.getElementById("content").innerHTML=`
        <div class="section-head">
            <div>
                <div class="section-title">메인</div>
                <div class="section-desc">최근 업데이트 정보를 확인합니다.</div>
            </div>
            <div class="count">AXE NET</div>
        </div>

        <div class="home-grid">

            <div class="home-card">

                <div class="home-card-title">최근 공지사항</div>

                ${
                    notices.length
                    ?
                    sortByRecent(notices).slice(0,5).map(item=>`
                        <div class="notice-item">
                            <div class="item-title">${safe(item.title)}</div>
                            <div class="item-date">${formatDate(item.date)}</div>
                        </div>
                    `).join("")
                    :
                    `<div class="ready">등록된 공지사항이 없습니다.</div>`
                }

            </div>

            <div class="home-card">

                <div class="home-card-title">최근 AXE TUBE</div>

                <div class="card-grid">
                    ${
                        recentTubes.length
                        ?
                        recentTubes.map(item=>`
                            <div class="card">

                                <div class="thumb">
                                    <img src="${escapeHtml(getTubeThumbnail(item))}">
                                </div>

                                <div class="card-body">
                                    <div class="card-title">${safe(item.title)}</div>

                                    <div class="card-meta">
                                        <span class="tube-stat-badge">${safe(item.writer||"AXE")}</span>
                                        <span class="tube-stat-badge like">👍 ${Number(item.likes||0)}</span>
                                    </div>
                                </div>

                            </div>
                        `).join("")
                        :
                        `<div class="ready">영상이 없습니다.</div>`
                    }
                </div>

            </div>

        </div>

        <div class="home-card" style="margin-top:18px">

            <div class="home-card-title">최근 자유게시판</div>

            ${
                recentBoards.length
                ?
                recentBoards.map(item=>`
                    <div class="notice-item">
                        <div class="item-title">${safe(item.title)}</div>
                        <div class="item-date">${safe(item.writer)} · ${formatDate(item.date)}</div>
                    </div>
                `).join("")
                :
                `<div class="ready">게시글이 없습니다.</div>`
            }

        </div>

        <div class="home-card" style="margin-top:18px">

            <div class="home-card-title">최근 갤러리</div>

            <div class="card-grid">

                ${
                    recentGallery.length
                    ?
                    recentGallery.map(item=>{

                        const images=getGalleryImages(item);

                        return `
                            <div class="card">

                                <div class="thumb square">
                                    <img src="${escapeHtml(images[0]||"./axe.png")}">
                                </div>

                                <div class="card-body">
                                    <div class="card-title">${safe(item.title)}</div>

                                    <div class="card-meta">
                                        <span class="tube-stat-badge">${safe(item.writer||"익명")}</span>
                                    </div>
                                </div>

                            </div>
                        `;
                    }).join("")
                    :
                    `<div class="ready">갤러리 게시글이 없습니다.</div>`
                }

            </div>

        </div>
    `;
}

function showNotice(){

    setMenu(1);

    document.getElementById("content").innerHTML=`
        <div class="section-head">
            <div>
                <div class="section-title">공지사항</div>
                <div class="section-desc">공지 및 운영기준을 확인합니다.</div>
            </div>
            <div class="count">${notices.length+operations.length}개</div>
        </div>

        <div class="ready">
            현재 공지사항 UI는 정상 복구되었습니다.
        </div>
    `;
}

function showTube(){

    setMenu(2);

    const list=sortByRecent(tubes);

    document.getElementById("content").innerHTML=`
        <div class="section-head">
            <div>
                <div class="section-title">AXE TUBE</div>
                <div class="section-desc">영상 게시글을 확인합니다.</div>
            </div>
            <div class="count">${list.length}개</div>
        </div>

        <div class="card-grid">

            ${
                list.length
                ?
                list.map(item=>`
                    <div class="card">

                        <div class="thumb">
                            <img src="${escapeHtml(getTubeThumbnail(item))}">
                        </div>

                        <div class="card-body">

                            <div class="card-title">${safe(item.title)}</div>

                            <div class="card-meta">
                                <span class="tube-stat-badge">${safe(item.writer||"AXE")}</span>
                                <span class="tube-stat-badge like">👍 ${Number(item.likes||0)}</span>
                            </div>

                        </div>

                    </div>
                `).join("")
                :
                `<div class="ready">등록된 영상이 없습니다.</div>`
            }

        </div>
    `;
}

function showBoard(){

    setMenu(4);

    const list=sortByRecent(boards);

    document.getElementById("content").innerHTML=`
        <div class="section-head">
            <div>
                <div class="section-title">자유게시판</div>
                <div class="section-desc">AXE 구성원들의 자유게시판입니다.</div>
            </div>
            <div class="count">${list.length}개</div>
        </div>

        <div class="ready">
            게시판 기능 정상 복구 완료
        </div>
    `;
}

function showGallery(){

    setMenu(5);

    const list=sortByRecent(galleries);

    document.getElementById("content").innerHTML=`
        <div class="section-head">
            <div>
                <div class="section-title">갤러리</div>
                <div class="section-desc">AXE 활동 사진과 기록을 공유하는 공간입니다.</div>
            </div>
            <div class="count">${list.length}개</div>
        </div>

        <div class="card-grid">

            ${
                list.length
                ?
                list.map(item=>{

                    const images=getGalleryImages(item);

                    return `
                        <div class="card">

                            <div class="thumb square">
                                <img src="${escapeHtml(images[0]||"./axe.png")}">
                            </div>

                            <div class="card-body">

                                <div class="card-title">${safe(item.title)}</div>

                                <div class="card-meta">
                                    <span class="tube-stat-badge">${safe(item.writer||"익명")}</span>
                                    <span class="tube-stat-badge like">👍 ${Number(item.likes||0)}</span>
                                </div>

                            </div>

                        </div>
                    `;
                }).join("")
                :
                `<div class="ready">등록된 갤러리 게시글이 없습니다.</div>`
            }

        </div>
    `;
}

function showOutlaw(){
    setMenu(3);

    document.getElementById("content").innerHTML=`
        <div class="section-head">
            <div>
                <div class="section-title">무법지대</div>
                <div class="section-desc">브리핑맵 및 공략 정보입니다.</div>
            </div>
            <div class="count">${(briefingMaps||[]).length+(outlawGuides||[]).length}개</div>
        </div>

        <div class="ready">
            무법지대 구조 복구 완료
        </div>
    `;
}

function showInfo(){
    setMenu(6);

    document.getElementById("content").innerHTML=`
        <div class="section-head">
            <div>
                <div class="section-title">정보</div>
                <div class="section-desc">제작, 개조서, 퀘스트 등의 정보를 확인합니다.</div>
            </div>
            <div class="count">INFO</div>
        </div>

        <div class="ready">
            정보 시스템 구조 복구 완료
        </div>
    `;
}

function showUtility(){
    setMenu(7);

    document.getElementById("content").innerHTML=`
        <div class="section-head">
            <div>
                <div class="section-title">편의기능</div>
                <div class="section-desc">AXE 편의 기능입니다.</div>
            </div>
            <div class="count">UTILITY</div>
        </div>

        <div class="ready">
            편의 기능 구조 복구 완료
        </div>
    `;
}

function openTubeForm(){
    document.getElementById("tubeFormModal").classList.add("active");
}

function closeTubeForm(){
    document.getElementById("tubeFormModal").classList.remove("active");
}

function openBoardForm(){
    document.getElementById("boardFormModal").classList.add("active");
}

function closeBoardForm(){
    document.getElementById("boardFormModal").classList.remove("active");
}

function openGalleryForm(){
    document.getElementById("galleryFormModal").classList.add("active");
}

function closeGalleryForm(){
    document.getElementById("galleryFormModal").classList.remove("active");
}

fetch(API_URL)
.then(r=>r.json())
.then(data=>{

    notices=data.notices||[];
    operations=data.operations||[];

    tubes=data.tubes||[];
    tubeComments=data.tubeComments||[];

    boards=data.boards||[];
    boardComments=data.boardComments||[];

    galleries=data.galleries||[];
    galleryComments=data.galleryComments||[];

    briefingMaps=data.briefingMaps||[];
    outlawGuides=data.outlawGuides||[];

    crafts=data.crafts||[];
    materials=data.materials||[];
    craftRanks=data.craftRanks||[];

    quests=data.quests||[];

    processes=data.processes||[];
    materialRecipes=data.materialRecipes||[];

    modBooks=data.modBooks||[];
    skillRanks=data.skillRanks||[];

    showHome();

    setTimeout(hideLoading,350);

})
.catch(err=>{

    document.getElementById("content").innerHTML=`
        <div class="ready">
            데이터를 불러오지 못했습니다.<br><br>
            ${escapeHtml(String(err))}
        </div>
    `;

    hideLoading();
});

</script>
</body>
</html>
