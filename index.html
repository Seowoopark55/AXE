<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXE 정보센터</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, rgba(255, 166, 0, 0.14), transparent 34%),
        radial-gradient(circle at 85% 18%, rgba(255, 196, 70, 0.08), transparent 28%),
        linear-gradient(180deg, #050505 0%, #101010 45%, #050505 100%);
    color: #fff;
    font-family: Arial, sans-serif;
}

.wrap {
    max-width: 1220px;
    margin: auto;
    padding: 34px 18px 60px;
}

.hero {
    position: relative;
    overflow: hidden;
    border-radius: 28px;
    padding: 34px;
    margin-bottom: 22px;
    border: 1px solid rgba(255, 180, 40, 0.18);
    background:
        linear-gradient(135deg, rgba(255, 170, 0, 0.12), rgba(255,255,255,0.025)),
        linear-gradient(145deg, #171717, #080808);
    box-shadow: 0 24px 80px rgba(0,0,0,0.45);
}

.hero::after {
    content: "";
    position: absolute;
    right: -70px;
    top: -70px;
    width: 430px;
    height: 430px;
    background-image: url("./axe.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.08;
    pointer-events: none;
}

.hero-main {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 24px;
}

.logo-box {
    width: 148px;
    height: 148px;
    border-radius: 24px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255, 188, 55, 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    box-shadow: inset 0 0 28px rgba(255, 170, 0, 0.06);
}

.logo-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.hero-text {
    flex: 1;
}

.kicker {
    color: #ffb52e;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
}

h1 {
    margin: 0;
    font-size: 42px;
    font-weight: 950;
    letter-spacing: -1px;
}

.sub {
    margin-top: 12px;
    color: #c6c6c6;
    font-size: 15px;
    line-height: 1.7;
    max-width: 720px;
}

.menu {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 22px;
}

.menu-card {
    background: rgba(18,18,18,0.92);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px 12px;
    cursor: pointer;
    transition: 0.16s ease;
    text-align: center;
    color: #bdbdbd;
}

.menu-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 180, 40, 0.35);
    color: #fff;
}

.menu-card.active-menu {
    border-color: rgba(255, 181, 46, 0.75);
    background: rgba(255, 181, 46, 0.10);
    color: #ffb52e;
}

.menu-title {
    font-size: 14px;
    font-weight: 850;
}

.panel {
    background: rgba(12,12,12,0.86);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 22px 70px rgba(0,0,0,0.32);
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 16px;
    margin-bottom: 18px;
}

.section-title {
    font-size: 27px;
    font-weight: 950;
    letter-spacing: -0.5px;
}

.section-desc {
    color: #9b9b9b;
    font-size: 13px;
    margin-top: 6px;
}

.count-badge {
    color: #ffb52e;
    background: rgba(255,181,46,0.09);
    border: 1px solid rgba(255,181,46,0.28);
    border-radius: 999px;
    padding: 8px 13px;
    font-size: 13px;
    white-space: nowrap;
    font-weight: 800;
}

.search-wrap {
    margin: 18px 0 16px;
}

.search-box {
    position: relative;
}

.search-box input {
    width: 100%;
    height: 58px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.11);
    background:
        linear-gradient(145deg, rgba(255,255,255,0.065), rgba(255,255,255,0.018));
    color: #fff;
    font-size: 16px;
    padding: 0 54px 0 52px;
    outline: none;
    transition: 0.15s ease;
}

.search-box input:focus {
    border-color: rgba(255,181,46,0.76);
    box-shadow: 0 0 0 4px rgba(255,181,46,0.09);
}

.search-icon {
    position: absolute;
    left: 19px;
    top: 50%;
    transform: translateY(-50%);
    color: #ffb52e;
    font-size: 19px;
}

.clear-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    background: #292929;
    color: #aaa;
    cursor: pointer;
    display: none;
}

.clear-btn:hover {
    background: #383838;
    color: #fff;
}

.filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0 18px;
}

.filter button {
    background: rgba(255,255,255,0.045);
    color: #cfcfcf;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 9px 14px;
    cursor: pointer;
    transition: 0.15s ease;
    font-weight: 800;
}

.filter button:hover {
    background: rgba(255,255,255,0.08);
}

.filter button.active {
    border-color: rgba(255,181,46,0.65);
    color: #ffb52e;
    background: rgba(255,181,46,0.09);
}

.result-info {
    color: #888;
    font-size: 13px;
    margin-bottom: 14px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    align-items: start;
}

.card {
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(145deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018)),
        #111;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px;
    padding: 18px;
    cursor: pointer;
    transition: 0.16s ease;
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(255,181,46,0.13), transparent 42%);
    opacity: 0;
    transition: 0.16s ease;
    pointer-events: none;
}

.card:hover {
    transform: translateY(-3px);
    border-color: rgba(255,181,46,0.36);
}

.card:hover::before {
    opacity: 1;
}

.card-inner {
    position: relative;
    z-index: 1;
}

.item-name {
    font-size: 20px;
    font-weight: 950;
    margin-bottom: 12px;
    letter-spacing: -0.2px;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 13px;
}

.badge {
    font-size: 12px;
    padding: 6px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #ddd;
    font-weight: 800;
}

.badge.rate {
    color: #ffcf63;
    border-color: rgba(255,207,99,0.34);
    background: rgba(255,207,99,0.08);
}

.badge.rank {
    color: #ff8f2c;
    border-color: rgba(255,143,44,0.34);
    background: rgba(255,143,44,0.08);
}

.meta {
    font-size: 13px;
    color: #9d9d9d;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    border-top: 1px solid rgba(255,255,255,0.07);
    padding-top: 12px;
}

.open-hint {
    color: #666;
    font-size: 12px;
    white-space: nowrap;
}

.materials {
    display: none;
    margin-top: 15px;
    padding: 14px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
}

.material-title {
    font-size: 14px;
    font-weight: 950;
    margin-bottom: 10px;
    color: #fff;
}

.material-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    color: #ddd;
    font-size: 14px;
}

.material-row:last-child {
    border-bottom: none;
}

.qty {
    color: #ffb52e;
    font-weight: 950;
    white-space: nowrap;
}

.empty {
    color: #999;
    padding: 28px;
    border: 1px dashed rgba(255,255,255,0.14);
    border-radius: 18px;
    background: rgba(255,255,255,0.03);
}

@media (max-width: 980px) {
    .menu {
        grid-template-columns: repeat(3, 1fr);
    }

    .grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .hero-main {
        align-items: flex-start;
    }

    .logo-box {
        width: 118px;
        height: 118px;
    }
}

@media (max-width: 620px) {
    .wrap {
        padding: 22px 14px 40px;
    }

    .hero {
        padding: 22px;
    }

    .hero-main {
        display: block;
    }

    .logo-box {
        width: 100%;
        height: 140px;
        margin-bottom: 18px;
    }

    h1 {
        font-size: 30px;
    }

    .menu {
        grid-template-columns: repeat(2, 1fr);
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .section-head {
        display: block;
    }

    .count-badge {
        display: inline-block;
        margin-top: 10px;
    }

    .meta {
        display: block;
        line-height: 1.7;
    }

    .open-hint {
        display: block;
        margin-top: 4px;
    }
}
</style>
</head>

<body>

<div class="wrap">

    <div class="hero">
        <div class="hero-main">
            <div class="logo-box">
                <img src="./axe.png" alt="AXE 로고">
            </div>

            <div class="hero-text">
                <div class="kicker">AXE COMPANY DATABASE</div>
                <h1>AXE 정보센터</h1>
                <div class="sub">
                    제작 정보, 재료 목록, 랭크 조건 등 회사 활동에 필요한 핵심 데이터를 빠르게 확인하는 내부 정보 허브입니다.
                </div>
            </div>
        </div>
    </div>

    <div class="menu">
        <div class="menu-card active-menu" onclick="showCraft()">
            <div class="menu-title">제작 정보</div>
        </div>
        <div class="menu-card" onclick="showReady(1)">
            <div class="menu-title">아이템 시세</div>
        </div>
        <div class="menu-card" onclick="showReady(2)">
            <div class="menu-title">스킬</div>
        </div>
        <div class="menu-card" onclick="showReady(3)">
            <div class="menu-title">생활</div>
        </div>
        <div class="menu-card" onclick="showReady(4)">
            <div class="menu-title">무법지대</div>
        </div>
        <div class="menu-card" onclick="showReady(5)">
            <div class="menu-title">상자</div>
        </div>
    </div>

    <div class="panel" id="content"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyGjviirSK0lP3KMP50JkQBZip2eWS6JpGDVWWXDKeljoYhpzuohnKLllpTmja0sYikkw/exec";

const categoryMap = {
    "ALL": "전체",
    "SMG": "SMG",
    "PISTOL": "피스톨",
    "REVOLVER": "리볼버",
    "KNIFE": "나이프",
    "ETC": "기타"
};

let crafts = [];
let materials = [];
let currentCategory = "ALL";
let searchKeyword = "";

fetch(API_URL)
    .then(res => res.json())
    .then(data => {
        crafts = data.crafts || [];
        materials = data.materials || [];
        showCraft();
    })
    .catch(() => {
        document.getElementById("content").innerHTML = `
            <div class="empty">데이터를 불러오지 못했습니다.</div>
        `;
    });

function getCategoryName(category) {
    return categoryMap[category] || category || "-";
}

function setActiveMenu(index) {
    document.querySelectorAll(".menu-card").forEach((el, i) => {
        el.classList.toggle("active-menu", i === index);
    });
}

function showCraft() {
    setActiveMenu(0);

    const categories = ["ALL", ...new Set(crafts.map(c => c.category).filter(Boolean))];

    let html = `
        <div class="section-head">
            <div>
                <div class="section-title">제작 정보</div>
                <div class="section-desc">아이템명, 재료명, 분류로 검색하고 카드를 눌러 필요 재료를 확인하세요.</div>
            </div>
            <div class="count-badge" id="countBadge">총 ${crafts.length}개</div>
        </div>

        <div class="search-wrap">
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input
                    id="searchInput"
                    type="text"
                    placeholder="아이템명 또는 재료명 검색"
                    value="${searchKeyword}"
                    oninput="handleSearch(this.value)"
                >
                <button class="clear-btn" id="clearBtn" onclick="clearSearch()">×</button>
            </div>
        </div>

        <div class="filter">
    `;

    categories.forEach(cat => {
        html += `
            <button class="${cat === currentCategory ? "active" : ""}" onclick="filterCraft('${cat}')">
                ${getCategoryName(cat)}
            </button>
        `;
    });

    html += `
        </div>
        <div class="result-info" id="resultInfo"></div>
        <div class="grid" id="craftGrid"></div>
    `;

    document.getElementById("content").innerHTML = html;
    renderCrafts();
}

function filterCraft(cat) {
    currentCategory = cat;
    showCraft();
}

function handleSearch(value) {
    searchKeyword = value.trim();
    renderCrafts();

    const clearBtn = document.getElementById("clearBtn");
    if (clearBtn) {
        clearBtn.style.display = searchKeyword ? "block" : "none";
    }
}

function clearSearch() {
    searchKeyword = "";
    const input = document.getElementById("searchInput");
    if (input) input.value = "";
    renderCrafts();

    const clearBtn = document.getElementById("clearBtn");
    if (clearBtn) clearBtn.style.display = "none";
}

function renderCrafts() {
    const grid = document.getElementById("craftGrid");
    const resultInfo = document.getElementById("resultInfo");
    const countBadge = document.getElementById("countBadge");
    const clearBtn = document.getElementById("clearBtn");

    if (!grid) return;

    if (clearBtn) {
        clearBtn.style.display = searchKeyword ? "block" : "none";
    }

    let list = currentCategory === "ALL"
        ? crafts
        : crafts.filter(c => c.category === currentCategory);

    const keyword = searchKeyword.toLowerCase();

    if (keyword) {
        list = list.filter(c => {
            const itemMaterials = materials.filter(m => m.craft_id === c.id);

            const targetText = [
                c.item_name,
                c.category,
                getCategoryName(c.category),
                c.success_rate,
                c.craft_rank,
                c.obtain_place,
                c.note,
                ...itemMaterials.map(m => m.material_name)
            ].join(" ").toLowerCase();

            return targetText.includes(keyword);
        });
    }

    const categoryText = getCategoryName(currentCategory);

    if (resultInfo) {
        resultInfo.textContent = `분류: ${categoryText} · 검색 결과 ${list.length}개`;
    }

    if (countBadge) {
        countBadge.textContent = `${list.length}개 표시`;
    }

    if (list.length === 0) {
        grid.innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`;
        return;
    }

    grid.innerHTML = "";

    list.forEach(c => {
        const itemMaterials = materials.filter(m => m.craft_id === c.id);

        const card = document.createElement("div");
        card.className = "card";

        let matHtml = "";

        if (itemMaterials.length > 0) {
            itemMaterials.forEach(m => {
                matHtml += `
                    <div class="material-row">
                        <span>${m.material_name}</span>
                        <span class="qty">x${m.quantity}</span>
                    </div>
                `;
            });
        } else {
            matHtml = `
                <div class="material-row">
                    <span>등록된 재료 없음</span>
                </div>
            `;
        }

        card.innerHTML = `
            <div class="card-inner">
                <div class="item-name">${c.item_name || "이름 없음"}</div>

                <div class="badges">
                    <span class="badge">${getCategoryName(c.category)}</span>
                    <span class="badge rate">성공률 ${c.success_rate || "-"}%</span>
                    <span class="badge rank">랭크 ${c.craft_rank || "-"}</span>
                </div>

                <div class="meta">
                    <span>획득처: ${c.obtain_place || "-"}</span>
                    <span class="open-hint">클릭하여 재료 보기</span>
                </div>

                <div class="materials">
                    <div class="material-title">필요 재료</div>
                    ${matHtml}
                </div>
            </div>
        `;

        card.onclick = () => {
            const matBox = card.querySelector(".materials");
            const hint = card.querySelector(".open-hint");
            const isOpen = matBox.style.display === "block";

            matBox.style.display = isOpen ? "none" : "block";
            hint.textContent = isOpen ? "클릭하여 재료 보기" : "클릭하여 접기";
        };

        grid.appendChild(card);
    });
}

function showReady(index) {
    setActiveMenu(index);

    document.getElementById("content").innerHTML = `
        <div class="section-head">
            <div>
                <div class="section-title">준비중</div>
                <div class="section-desc">아직 연결되지 않은 카테고리입니다.</div>
            </div>
            <div class="count-badge">준비중</div>
        </div>
        <div class="empty">해당 정보는 추후 추가 예정입니다.</div>
    `;
}
</script>

</body>
</html>
