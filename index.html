<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXE NET</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,rgba(255,181,46,.14),transparent 34%),linear-gradient(180deg,#050505 0%,#111 45%,#070707 100%);color:#fff;font-family:Arial,sans-serif}

#loadingScreen{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at top,rgba(255,181,46,.16),transparent 35%),#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s ease,visibility .35s ease}
#loadingScreen.hide{opacity:0;visibility:hidden}
.loading-logo{width:120px;height:120px;border-radius:24px;border:1px solid rgba(255,181,46,.35);background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:14px;animation:pulseLogo 1.4s ease-in-out infinite}
.loading-logo img{max-width:100%;max-height:100%;object-fit:contain}
.loading-title{margin-top:20px;font-size:28px;font-weight:950;color:#ffb52e;letter-spacing:1px}
.loading-text{margin-top:8px;font-size:13px;color:#aaa;letter-spacing:.4px}
@keyframes pulseLogo{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(255,181,46,0)}50%{transform:scale(1.04);box-shadow:0 0 34px rgba(255,181,46,.22)}}

.wrap{max-width:1280px;margin:auto;padding:28px 18px 50px}
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:22px;min-height:184px;padding:30px 34px;margin-bottom:18px;border-radius:24px;border:1px solid rgba(255,181,46,.2);background:linear-gradient(135deg,rgba(255,181,46,.13),rgba(255,255,255,.025)),#101010;cursor:pointer;transition:.22s ease}
.hero>*{position:relative;z-index:2}
.hero::after{content:"AXE";position:absolute;right:34px;top:50%;transform:translateY(-50%);z-index:0;font-size:112px;font-weight:950;color:rgba(255,255,255,.035);letter-spacing:9px;line-height:1;pointer-events:none;animation:heroWatermarkFloat 5.5s ease-in-out infinite}
.hero::before{content:"NETWORK";position:absolute;right:42px;bottom:26px;z-index:1;font-size:14px;font-weight:950;color:rgba(255,181,46,.22);letter-spacing:6px;pointer-events:none}
.hero-shine{position:absolute!important;inset:-80px auto -80px -35%;z-index:1!important;width:32%;background:linear-gradient(90deg,transparent,rgba(255,181,46,.08),rgba(255,255,255,.08),transparent);transform:skewX(-18deg);animation:heroShine 5.8s ease-in-out infinite;pointer-events:none}
@keyframes heroWatermarkFloat{0%,100%{transform:translateY(-50%) translateX(0);opacity:1}50%{transform:translateY(-52%) translateX(-8px);opacity:.82}}
@keyframes heroShine{0%{left:-45%;opacity:0}18%{opacity:1}42%{left:115%;opacity:0}100%{left:115%;opacity:0}}
.hero:hover{transform:translateY(-2px);border-color:rgba(255,181,46,.45);box-shadow:0 16px 45px rgba(0,0,0,.35)}
.logo-box{width:128px;height:128px;border-radius:22px;background:rgba(0,0,0,.35);border:1px solid rgba(255,181,46,.2);display:flex;align-items:center;justify-content:center;padding:12px}
.logo-box img{max-width:100%;max-height:100%;object-fit:contain}
.kicker{color:#ffb52e;font-size:13px;font-weight:800;letter-spacing:1.4px;margin-bottom:8px}
h1{margin:0;font-size:42px;font-weight:950;letter-spacing:.5px}
.sub{margin-top:10px;color:#c4c4c4;font-size:15px;line-height:1.6}

.main-menu-shell{position:relative;margin:0 0 18px}
.main-menu{display:flex;align-items:center;gap:0;margin:0;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),rgba(5,5,5,.88);overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.22)}
.main-menu button{position:relative;min-width:112px;height:46px;background:transparent;color:#cfcfcf;border:0;border-right:1px solid rgba(255,255,255,.06);cursor:pointer;font-size:15px;font-weight:900;letter-spacing:.1px;transition:.22s ease}
.main-menu button:last-child{border-right:0}
.main-menu button::before{content:"";position:absolute;left:18px;right:18px;bottom:0;height:3px;background:#ffb52e;transform:scaleX(0);transform-origin:center;transition:.22s ease}
.main-menu button::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,181,46,.12),transparent);opacity:0;transition:.22s ease}
.main-menu button:hover{color:#fff;transform:translateY(-1px)}
.main-menu button:hover::after{opacity:1}
.main-menu button:hover::before{transform:scaleX(.55)}
.main-menu button.active{color:#ffb52e;background:rgba(255,181,46,.08)}
.main-menu button.active::before{transform:scaleX(1)}

.info-menu,.sub-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.info-menu button,.sub-filter button,.back-btn,.tube-submit-open{background:rgba(20,20,20,.92);color:#bbb;border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:850;transition:.18s ease}
.info-menu button.active,.sub-filter button.active{color:#ffb52e;background:rgba(255,181,46,.1);border-color:rgba(255,181,46,.65)}
.outlaw-tabs{position:relative;align-items:center}
.outlaw-tabs button{position:relative;overflow:hidden}
.outlaw-tabs button.active{color:#ffb52e;background:rgba(255,181,46,.08);border-color:rgba(255,181,46,.65);box-shadow:none}
.outlaw-tabs button.active::after{display:none}
.outlaw-tabs button:hover{box-shadow:none}
.back-btn:hover,.info-menu button:hover,.sub-filter button:hover,.tube-submit-open:hover{color:#ffb52e;border-color:rgba(255,181,46,.45);transform:translateY(-1px)}

.panel{border:1px solid rgba(255,255,255,.08);background:rgba(12,12,12,.88);border-radius:22px;padding:22px}
.section-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}
.section-title{font-size:25px;font-weight:950}
.section-desc{color:#909090;font-size:13px;margin-top:5px}
.count{color:#ffb52e;background:rgba(255,181,46,.09);border:1px solid rgba(255,181,46,.25);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:850;white-space:nowrap}
.home-grid{display:grid;grid-template-columns:.85fr 1.4fr;gap:18px}
.home-card{border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.25);border-radius:18px;padding:16px}
.home-card-title{font-size:18px;font-weight:950;margin-bottom:12px;color:#ffb52e}

.notice-item{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;transition:transform .16s ease,background .16s ease}
.notice-item:last-child{border-bottom:none}
.notice-item:hover{background:rgba(255,181,46,.045);transform:translateX(6px)}
.notice-board-head{display:grid;grid-template-columns:1fr 130px 80px;gap:12px;padding:12px 16px;color:#888;font-size:12px;font-weight:900;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025)}
.notice-row{display:grid;grid-template-columns:1fr 130px 80px;gap:12px;align-items:center;padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;transition:.16s ease}
.notice-row:hover{background:rgba(255,181,46,.06);padding-left:22px}
.notice-row-title{font-size:15px;font-weight:900}
.notice-row-date,.notice-row-type{font-size:12px;color:#888}
.notice-detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.notice-detail-content{white-space:pre-line;line-height:1.75;font-size:15px;color:#ddd;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:18px}

.item-title{font-size:15px;font-weight:900}
.item-date{margin-top:5px;font-size:12px;color:#888}
.item-content{margin-top:6px;font-size:13px;color:#aaa;line-height:1.5}
.important{display:inline-block;margin-right:6px;color:#ff5d5d;font-weight:950}

.tube-actions{display:flex;justify-content:flex-end;margin-bottom:14px}
.tube-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tube-card{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s ease}
.tube-card:hover,.item-row:hover{border-color:rgba(255,181,46,.45);background:rgba(255,181,46,.06);transform:translateY(-2px)}
.tube-thumb{width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.tube-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s ease}
.tube-card:hover .tube-thumb img{transform:scale(1.04)}
.tube-body{padding:13px}
.tube-meta-line{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;color:#888;font-size:12px}
.tube-stat-badge{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);color:#aaa;font-size:12px;font-weight:900}
.tube-stat-badge.like{color:#91bdff;background:rgba(76,154,255,.12);border-color:rgba(76,154,255,.38)}
.tube-stat-badge.comment{color:#c8adff;background:rgba(156,95,255,.16);border-color:rgba(156,95,255,.48)}
.tube-detail-video{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.1);margin:14px 0 16px}
.tube-detail-video iframe{width:100%;height:100%;border:0;display:block}


.form-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:14px;z-index:9999}
.form-modal.active{display:flex}
.form-box{width:min(520px,100%);background:#0d0d0d;border:1px solid rgba(255,181,46,.25);border-radius:18px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.55)}
.form-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.form-title{font-weight:950;color:#ffb52e}
.form-close{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:18px}
.form-body{padding:16px}
.form-label{font-size:12px;color:#aaa;margin:10px 0 6px;font-weight:850}
.form-input,.form-textarea{width:100%;border:1px solid rgba(255,255,255,.1);background:#151515;color:#fff;border-radius:12px;padding:12px;outline:none;font-family:Arial,sans-serif}
.form-input:focus,.form-textarea:focus{border-color:rgba(255,181,46,.65)}
.form-textarea{min-height:110px;resize:vertical}
.form-submit{width:100%;height:44px;margin-top:14px;border:0;border-radius:12px;background:#ffb52e;color:#111;font-weight:950;cursor:pointer}
.form-submit:hover{filter:brightness(1.06)}
.form-help{font-size:12px;color:#888;line-height:1.5;margin-top:10px}

.toolbar{display:flex;gap:10px;margin-bottom:14px}
.search{flex:1;position:relative}
.search input{width:100%;height:46px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:#151515;color:#fff;padding:0 42px 0 15px;outline:none}
.search input:focus{border-color:rgba(255,181,46,.7)}
.search-mark{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#ffb52e}
.result-info{color:#888;font-size:13px;margin-bottom:12px}
.db-layout{display:grid;grid-template-columns:360px 1fr;gap:18px;min-height:560px}
.outlaw-layout{grid-template-columns:270px 1fr;gap:14px}
.item-list{border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(0,0,0,.22);overflow:hidden}
.list-scroll{max-height:560px;overflow-y:auto}
.item-row{padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;transition:.16s ease}
.item-row.active{background:rgba(255,181,46,.1);border-left:3px solid #ffb52e}
.item-name{font-size:16px;font-weight:900}
.item-sub{margin-top:5px;color:#888;font-size:12px}
.detail{border:1px solid rgba(255,255,255,.08);border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),rgba(0,0,0,.25);padding:24px}
.map-detail{padding:14px}
.empty-detail{min-height:240px;display:flex;align-items:center;justify-content:center;color:#888;border:1px dashed rgba(255,255,255,.12);border-radius:14px}
.detail-title{font-size:30px;font-weight:950;margin-bottom:14px}
.map-detail .detail-title{font-size:26px;margin-bottom:10px}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.map-detail .badges{margin-bottom:12px}
.badge{font-size:13px;font-weight:850;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#ddd}
.badge.gold{color:#ffb52e;background:rgba(255,181,46,.09);border-color:rgba(255,181,46,.28)}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.map-detail .info-grid{margin-bottom:12px}
.info-card{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:13px}
.info-label{color:#888;font-size:12px;margin-bottom:6px}
.info-value{font-weight:900;font-size:16px}
.material-title{font-size:18px;font-weight:950;margin-bottom:10px}
.material-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);color:#ddd}
.qty{color:#ffb52e;font-weight:950}
.map-image{width:100%;max-height:420px;object-fit:contain;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#000;margin-bottom:14px;cursor:zoom-in;display:block}

/* 무법지대 공략 */
.guide-main-image{width:100%;max-height:460px;object-fit:contain;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#000;margin-bottom:18px;cursor:zoom-in;display:block}
.guide-route-title{font-size:21px;font-weight:950;color:#ffb52e;margin:22px 0 12px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.guide-step{border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.24);border-radius:16px;padding:16px;margin-bottom:14px}
.guide-step-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.guide-step-no{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:30px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,181,46,.35);background:rgba(255,181,46,.09);color:#ffb52e;font-size:13px;font-weight:950}
.guide-step-title{font-size:17px;font-weight:950;color:#fff}
.guide-step-content{white-space:pre-line;line-height:1.65;color:#bbb;font-size:14px;margin-bottom:12px}
.guide-step-image{width:100%;max-height:420px;object-fit:contain;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#000;cursor:zoom-in;display:block}
.guide-video-thumb{position:relative;width:100%;max-height:420px;aspect-ratio:16/9;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#000;overflow:hidden;cursor:pointer;margin-top:10px}
.guide-video-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s ease}
.guide-video-thumb:hover img{transform:scale(1.04);filter:brightness(.72)}
.guide-video-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:22px;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;font-weight:950;padding-left:5px;box-shadow:0 14px 38px rgba(0,0,0,.45);transition:.18s ease}
.guide-video-thumb:hover .guide-video-play{color:#ffb52e;border-color:rgba(255,181,46,.65);transform:translate(-50%,-50%) scale(1.06)}
.guide-video-label{position:absolute;left:12px;bottom:12px;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.72);color:#ffb52e;font-size:12px;font-weight:900;border:1px solid rgba(255,181,46,.35)}

.final-material-section{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.final-material-toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,181,46,.18);background:linear-gradient(135deg,rgba(255,181,46,.07),rgba(255,255,255,.025));cursor:pointer;transition:.18s ease;user-select:none}
.final-material-toggle:hover{border-color:rgba(255,181,46,.42);background:linear-gradient(135deg,rgba(255,181,46,.105),rgba(255,255,255,.035));transform:translateY(-1px)}
.final-material-toggle-left{min-width:0;display:flex;flex-direction:column;gap:4px}
.final-material-toggle-title{font-size:14px;font-weight:950;color:#ffb52e;letter-spacing:.1px}
.final-material-toggle-summary{font-size:12px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:720px;line-height:1.35}
.final-material-toggle-action{flex:none;color:#ffb52e;font-size:12px;font-weight:950;border:1px solid rgba(255,181,46,.28);background:rgba(255,181,46,.07);border-radius:999px;padding:7px 10px;white-space:nowrap}
.final-material-detail{display:none;margin-top:12px}
.final-material-detail.active{display:block}
.final-material-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.final-material-card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.075);background:rgba(0,0,0,.23)}
.final-material-name{font-size:13px;font-weight:900;color:#ddd;line-height:1.35;min-width:0}
.final-material-qty{font-size:14px;font-weight:950;color:#ffb52e;white-space:nowrap}
.final-material-tag{margin-left:6px;font-size:10px;color:#858585;font-weight:850}
.recipe-breakdown{margin-top:12px;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(0,0,0,.2);overflow:hidden}
.recipe-breakdown-title{padding:10px 12px;color:#aaa;font-size:12px;font-weight:950;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.025)}
.recipe-breakdown-row{display:grid;grid-template-columns:210px 1fr;gap:12px;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.055);font-size:12px;color:#aaa;line-height:1.45}
.recipe-breakdown-row:last-child{border-bottom:0}
.recipe-breakdown-row strong{color:#ddd}
.recipe-breakdown-row span:last-child{color:#ffb52e;font-weight:850;text-align:left}

.operation-content{white-space:pre-line;line-height:1.75;font-size:15px;color:#ddd}
.ready{padding:28px;color:#999;border:1px dashed rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.03)}
.video-modal,.image-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:6px;z-index:9999}
.video-modal.active,.image-modal.active{display:flex}
.video-box{width:min(960px,100%);background:#0d0d0d;border:1px solid rgba(255,181,46,.25);border-radius:18px;overflow:hidden}
.video-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.video-title{font-weight:900;color:#ffb52e}
.video-close{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:18px}
.video-frame{width:100%;aspect-ratio:16/9;background:#000}
.video-frame iframe{width:100%;height:100%;border:0}
.image-modal{padding:18px;overflow:auto}
.image-modal-box{position:relative;display:inline-block;max-width:95vw;max-height:90vh}
.image-modal-box img{width:auto;height:auto;max-width:95vw;max-height:90vh;object-fit:contain;border-radius:10px;border:1px solid rgba(255,181,46,.35);background:#000;display:block;cursor:default;transition:none;transform-origin:center center}
.image-close{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.72);color:#fff;font-size:24px;font-weight:900;line-height:1;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;transition:.18s ease;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.image-close:hover{color:#ffb52e;border-color:rgba(255,181,46,.7);background:rgba(20,20,20,.95);transform:scale(1.04)}


/* 플리카 계산기 */
.plica-panel{border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.24);border-radius:18px;padding:18px;margin-bottom:18px}
.plica-control-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.plica-input-box{display:flex;flex-direction:column;gap:7px;min-width:190px}
.plica-label{color:#aaa;font-size:13px;font-weight:850}
.plica-input{width:190px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#151515;color:#fff;padding:0 13px;outline:none;font-size:16px}
.plica-input:focus{border-color:rgba(255,181,46,.65)}
.plica-preset-box{display:flex;flex-wrap:wrap;gap:8px}
.plica-btn{background:rgba(20,20,20,.92);color:#bbb;border:1px solid rgba(255,255,255,.09);border-radius:999px;width:48px;height:42px;cursor:pointer;font-weight:900;transition:.18s ease}
.plica-btn:hover,.plica-btn.active{color:#ffb52e;background:rgba(255,181,46,.1);border-color:rgba(255,181,46,.65);transform:translateY(-1px)}
.plica-summary{margin-top:14px;color:#aaa;font-size:13px}

    bottom:0;
    width:4px;

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx3zYCP53EhF_zXTVabr_HPtcH1FOV13qi31764rUgkQdvSQCZt0R1JDkaIxbLOvRecEw/exec";

const categoryMap={ALL:"전체",SMG:"SMG",PISTOL:"피스톨",REVOLVER:"리볼버",KNIFE:"나이프",ETC:"기타"};

let crafts=[],materials=[],notices=[],tubes=[],tubeComments=[],briefingMaps=[],outlawGuides=[],operations=[],quests=[],processes=[],materialRecipes=[],modBooks=[],skillRanks=[],boards=[],boardComments=[];
let currentCategory="ALL",searchKeyword="",selectedId="";
let mapSearchKeyword="",selectedMapId="";
let selectedGuideId="";
let operationCategory="ALL",selectedOperationId="";
let questSearchKeyword="",questJobFilter="";
let processSearchKeyword="",processJobFilter="";
let modBookTypeFilter="접두",modBookCategoryFilter="",modBookSearchKeyword="";
let skillRankSearchKeyword="",skillRankFilter="";
let selectedBoardId="";
let currentMainSection="";
let currentHistoryPage="home";
const mainPageKeys=["home","notice","tube","outlaw","board","info","utility"];

function normalizeMainPage(page){
    return mainPageKeys.includes(page)?page:"home";
}

function renderMainPage(page){
    const target=normalizeMainPage(page);
    currentHistoryPage=target;

    if(target==="home"){showHome();return;}
    if(target==="notice"){showNotice();return;}
    if(target==="tube"){showTube();return;}
    if(target==="outlaw"){showOutlaw();return;}
    if(target==="info"){showInfo();return;}
    if(target==="utility"){showUtility();return;}
    if(target==="board"){showBoard();return;}

    showHome();
}

function navigateMain(page,push=true){
    const target=normalizeMainPage(page);

    if(push&&currentHistoryPage!==target){
        history.pushState({page:target},"","#"+target);
    }

    renderMainPage(target);
}

function normalizeSubTab(page,subTab){
    const defaults={notice:"noticeList",outlaw:"briefing",info:"craft",utility:"plica"};
    const allowed={
        notice:["noticeList","operations"],
        outlaw:["briefing","guide"],
        info:["craft","quest","process","modbook","skillrank"],
        utility:["plica"]
    };
    const target=normalizeMainPage(page);
    const list=allowed[target]||[];
    return list.includes(subTab)?subTab:(defaults[target]||"");
}

function renderSubTab(page,subTab){
    const target=normalizeMainPage(page);
    const tab=normalizeSubTab(target,subTab);

    if(target==="notice"){
        if(tab==="operations"){showOperationList();return;}
        showNoticeList();return;
    }

    if(target==="outlaw"){
        if(tab==="guide"){showOutlawGuides();return;}
        showBriefingMaps();return;
    }

    if(target==="info"){
        if(tab==="quest"){showQuest();return;}
        if(tab==="process"){showProcess();return;}
        if(tab==="modbook"){showModBooks();return;}
        if(tab==="skillrank"){showSkillRanks();return;}
        showCraft();return;
    }

    if(target==="utility"){
        showPlicaCalculator();return;
    }
}

function navigateSubTab(page,subTab,push=true){
    const target=normalizeMainPage(page);
    const tab=normalizeSubTab(target,subTab);
    const current=history.state||{};

    if(push&&(current.page!==target||current.subTab!==tab)){
        history.pushState({page:target,subTab:tab},"",`#${target}-${tab}`);
    }

    currentHistoryPage=target;
    renderSubTab(target,tab);
}

function pushListStateBeforeDetail(page){
    const target=normalizeMainPage(page);
    if(currentHistoryPage!==target){
        history.pushState({page:target},"","#"+target);
        currentHistoryPage=target;
    }
}

function pushDetailState(page,detailType,id){
    const target=normalizeMainPage(page);
    pushListStateBeforeDetail(target);
    history.pushState({page:target,detailType:detailType,id:String(id)},"",`#${target}-${detailType}-${encodeURIComponent(String(id))}`);
}

function goBackToList(page){
    const target=normalizeMainPage(page);
    if(history.state&&history.state.detailType){
        history.back();
        return;
    }
    navigateMain(target);
}

function initMainHistory(){
    const startPage="home";
    currentHistoryPage=startPage;
    history.replaceState({page:startPage},"",location.pathname+location.search);
    renderMainPage(startPage);
}

window.addEventListener("popstate",function(event){
    const state=event.state||{};
    const page=state.page?state.page:(location.hash.replace("#","")||"home");

    if(state.detailType==="notice"&&state.id){
        renderMainPage("notice");
        openNoticeDetail(state.id,false);
        return;
    }

    if(state.detailType==="board"&&state.id){
        renderMainPage("board");
        openBoardDetail(state.id,false,false);
        return;
    }

    if(state.detailType==="tube"&&state.id){
        renderMainPage("tube");
        openTubeDetail(state.id,false,false);
        return;
    }

    if(state.subTab){
        renderMainPage(page);
        renderSubTab(page,state.subTab);
        return;
    }

    renderMainPage(page);
});

function resetInfoState(){
    currentCategory="ALL";
    searchKeyword="";
    selectedId="";
    questSearchKeyword="";
    questJobFilter="";
    processSearchKeyword="";
    processJobFilter="";
    modBookTypeFilter="접두";
    modBookCategoryFilter="";
    modBookSearchKeyword="";
    skillRankSearchKeyword="";
    skillRankFilter="";
}

function resetNoticeState(){
    operationCategory="ALL";
    selectedOperationId="";
}

function resetOutlawState(){
    mapSearchKeyword="";
    selectedMapId="";
    selectedGuideId="";
}

function resetUtilityState(){
}

function resetBoardState(){
    selectedBoardId="";
}

function enterMainSection(section){
    if(currentMainSection===section)return;

    if(section==="notice")resetNoticeState();
    if(section==="outlaw")resetOutlawState();
    if(section==="info")resetInfoState();
    if(section==="utility")resetUtilityState();
    if(section==="board")resetBoardState();

    currentMainSection=section;
}

fetch(API_URL)
.then(res=>res.json())
.then(data=>{
    crafts=data.crafts||[];
    materials=data.materials||[];
    notices=data.notices||[];
    tubes=data.tubes||[];
    tubeComments=data.tubeComments||data.tube_comments||data.tube댓글||[];
    briefingMaps=data.briefingMaps||[];
    outlawGuides=data.outlawGuides||[];
    operations=data.operations||[];
    quests=data.quests||[];
    processes=data.processes||data.processData||data.processing||[];
    materialRecipes=data.materialRecipes||data.material_recipes||data.recipes||[];
    modBooks=data.modBooks||data.mod_books||[];
    skillRanks=data.skillRanks||data.skill_ranks||data.craftRanks||[];
    boards=data.boards||data.boardPosts||data.freeBoard||[];
    boardComments=data.boardComments||data.board_comments||data.comments||[];
    initMainHistory();
    hideLoading();
})
.catch(()=>{
    document.getElementById("content").innerHTML=`<div class="ready">데이터를 불러오지 못했습니다.</div>`;
    hideLoading();
});

function hideLoading(){
    const loading=document.getElementById("loadingScreen");
    if(!loading)return;
    loading.classList.add("hide");
    setTimeout(()=>loading.remove(),400);
}

function safe(v){return v===undefined||v===null||v===""?"-":v}
function escapeText(v){return String(v||"").replace(/'/g,"\\'").replace(/`/g,"\\`")}
function escapeAttr(v){return String(v||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function escapeTextarea(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function domSafeId(v){return String(v||"").replace(/[^a-zA-Z0-9_\-]/g,"_")}
function catName(cat){return categoryMap[cat]||cat||"-"}
function scrollToElement(id){const el=document.getElementById(id);if(!el)return;setTimeout(()=>{el.scrollIntoView({behavior:"smooth",block:"start"})},50)}
function setMainActive(index){document.querySelectorAll(".main-menu button").forEach((btn,i)=>btn.classList.toggle("active",i===index))}
function formatDate(v){if(!v)return "-";const d=new Date(v);if(isNaN(d.getTime()))return v;return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`}
function getNoticeId(n,i){return String(n.id||n.title||i)}
function isImportant(v){return String(v).toUpperCase()==="TRUE"}

function handleSearchKey(event,type){
    if(event.key!=="Escape")return;

    event.preventDefault();
    event.currentTarget.value="";

    if(type==="craft"){
        searchKeyword="";
        selectedId="";
        renderList();
        renderEmptyDetail();
        return;
    }

    if(type==="map"){
        mapSearchKeyword="";
        selectedMapId="";
        renderMapList();
        renderEmptyMapDetail();
        return;
    }

    if(type==="quest"){
        questSearchKeyword="";
        renderQuestTable();
        return;
    }

    if(type==="process"){
        processSearchKeyword="";
        renderProcessCards();
        return;
    }

    if(type==="modbook"){
        modBookSearchKeyword="";
        renderModBookList();
        renderEmptyModBookDetail();
        return;
    }

    if(type==="skillrank"){
        skillRankSearchKeyword="";
        renderSkillRankList();
        return;
    }
}

function getYoutubeId(url){
    if(!url)return "";
    const text=String(url).trim();
    const patterns=[/youtube\.com\/watch\?v=([^&]+)/,/youtu\.be\/([^?&]+)/,/youtube\.com\/embed\/([^?&]+)/,/youtube\.com\/shorts\/([^?&]+)/];
    for(const p of patterns){const m=text.match(p);if(m&&m[1])return m[1]}
    return "";
}

function getTubeThumb(t){
    if(t.thumbnail&&String(t.thumbnail).trim()!=="")return t.thumbnail;
    const id=getYoutubeId(t.url);
    if(!id)return "./axe.png";
    return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
}

function getTubePreview(t){
    const text=String(t.content||"").trim();
    if(!text)return "상세 내용을 확인하려면 영상을 선택하세요.";
    return text.length>60?text.substring(0,60)+"...":text;
}

function getVideoThumb(url){
    const id=getYoutubeId(url);
    if(!id)return "./axe.png";
    return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
}

function renderGuideVideoThumb(video,title){

    return `
        <div class="guide-video-thumb" onclick="openVideo('${escapeText(video)}','${escapeText(title)}')">
            <img src="${thumb}" onerror="this.src='./axe.png'">

            <div class="guide-video-label">동영상 재생</div>
        </div>

}

function openVideo(url,title){
    const id=getYoutubeId(url);
    if(!id){alert("유튜브 주소를 확인해주세요.");return}
    document.getElementById("videoTitle").textContent=title||"AXE TUBE";
    document.getElementById("videoFrame").innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    document.getElementById("videoModal").classList.add("active");
}

function closeVideo(){
    document.getElementById("videoModal").classList.remove("active");
    document.getElementById("videoFrame").innerHTML="";
}

function closeVideoOutside(event){if(event.target.id==="videoModal")closeVideo()}

let imageModalZoomed=false;

function openImageModal(src){
    const modal=document.getElementById("imageModal");
    const img=document.getElementById("imageModalImg");
    imageModalZoomed=false;
    img.src=src;
    img.style.transform="scale(1)";
    img.style.cursor="default";
    img.onclick=function(event){
        event.stopPropagation();
    };
    modal.classList.add("active");
}

function closeImageModal(){
    const modal=document.getElementById("imageModal");
    const img=document.getElementById("imageModalImg");
    modal.classList.remove("active");
    img.src="";
    img.style.transform="scale(1)";
    imageModalZoomed=false;
}

function closeTubeForm(){

    document.getElementById("tubeCategory").value="일반";

}

function submitTubePost(){
    const writer=document.getElementById("tubeWriter").value.trim();
    const title=document.getElementById("tubeTitle").value.trim();
    const url=document.getElementById("tubeUrl").value.trim();
    const thumbnail=document.getElementById("tubeThumbnail").value.trim();
    const category=document.getElementById("tubeCategory").value.trim()||"일반";
    const content=document.getElementById("tubeContent").value.trim();
    const password=document.getElementById("tubePassword").value.trim();

    if(!writer||!title||!url||!password){
        alert("작성자, 영상 제목, 유튜브 링크, 삭제 비밀번호는 필수입니다.");
        return;
    }

    if(!url.includes("youtube.com")&&!url.includes("youtu.be")){
        alert("유튜브 링크를 입력해주세요.");
        return;
    }

    postTubeApi({
        type:"tube_post",
        writer:writer,
        title:title,
        url:url,
        thumbnail:thumbnail,
        category:category,
        content:content,
        password:password
    })
    .then(data=>{
        if(data.result==="success"){
            const newTube={
                id:data.id||String(Date.now()),
                title:title,
                url:url,
                thumbnail:thumbnail,
                date:data.date||new Date().toISOString(),
                writer:writer,
                content:content,
                category:category,
                order:"",
                views:0,
                likes:0,
                dislikes:0,
                updated_at:""
            };
            tubes.unshift(newTube);
            alert("AXE TUBE 글이 등록되었습니다.");
            clearTubeForm();
            closeTubeForm();
            showTube();
            setTimeout(()=>openTubeDetail(getTubeId(newTube,0),false),80);
        }else{
            alert(data.message||"등록 중 오류가 발생했습니다.");
        }
    })
    .catch(()=>{
        alert("등록 중 오류가 발생했습니다.");
    });
}

function getTubeId(t,index){
    return String(t.id||t.title||index);
}

function getSortedTubes(){
    return tubes.slice().sort((a,b)=>{
        const ao=Number(a.order||0);
        const bo=Number(b.order||0);
        if(ao||bo)return ao-bo;
        const ad=new Date(a.date||0).getTime()||0;
        const bd=new Date(b.date||0).getTime()||0;
        return bd-ad;
    });
}

function getTubeCommentId(comment,index){
    return String(comment.comment_id||comment.id||index);
}

function getCommentsByTube(tubeId){
    return tubeComments.filter(c=>String(c.tube_id)===String(tubeId)).sort((a,b)=>{
        const ad=new Date(a.date||0).getTime()||0;
        const bd=new Date(b.date||0).getTime()||0;
        return ad-bd;
    });
}

function renderTubeCard(t,index){
    const id=getTubeId(t,index||0);
    const comments=getCommentsByTube(id).length;
    return `<div class="tube-card" onclick="openTubeDetail('${escapeText(id)}',true,true)">
        <div class="tube-thumb"><img src="${getTubeThumb(t)}" onerror="this.src='./axe.png'"></div>
        <div class="tube-body">
            <div class="item-title">${safe(t.title)}</div>
            <div class="item-date">${formatDate(t.date)}</div>
            <div class="item-content">${safe(getTubePreview(t))}</div>
            <div class="tube-meta-line">
                <span class="tube-stat-badge">조회 ${Number(t.views||0)}</span>
                <span class="tube-stat-badge like">👍 ${Number(t.likes||0)}</span>
                <span class="tube-stat-badge comment">💬 ${comments}</span>
            </div>
        </div>
    </div>`;
}

function findTubeById(id){
    const list=getSortedTubes();
    for(let i=0;i<list.length;i++){
        if(getTubeId(list[i],i)===String(id))return list[i];
    }
    return null;
}

function postTubeApi(payload){
    return fetch(API_URL,{method:"POST",body:JSON.stringify(payload)}).then(res=>res.json());
}

function getTubeLikeClientId(){
    const key="axe_tube_like_client_id";
    let id=localStorage.getItem(key);

        id="client_"+Date.now()+"_"+Math.random().toString(36).slice(2,10);
        localStorage.setItem(key,id);
    }

}

function getLikedTubes(){
    try{
        return JSON.parse(localStorage.getItem("axe_tube_liked_posts")||"[]");
    }catch(e){
        return [];
    }
}

function hasLikedTube(id){
    return getLikedTubes().includes(String(id));
}

function markTubeLiked(id){
    const list=getLikedTubes();
    const key=String(id);
    if(!list.includes(key)){
        list.push(key);
        localStorage.setItem("axe_tube_liked_posts",JSON.stringify(list));
    }
}

function unmarkTubeLiked(id){
    const key=String(id);
    const list=getLikedTubes().filter(item=>String(item)!==key);
    localStorage.setItem("axe_tube_liked_posts",JSON.stringify(list));
}

function toggleTubeLike(id){
    if(hasLikedTube(id)){
        unlikeTube(id);
        return;
    }
    likeTube(id);
}

function likeTube(id){
    postTubeApi({
        type:"tube_like",
        id:id,
        client_id:getTubeLikeClientId()
    })
    .then(data=>{
        if(data.result==="success"){
            markTubeLiked(id);
            const target=findTubeById(id);
            if(target){
                const wasDisliked=hasDislikedTube(id);
                target.likes=Number(target.likes||0)+1;
                if(wasDisliked)target.dislikes=Math.max(0,Number(target.dislikes||0)-1);
            }
            unmarkTubeDisliked(id);
            openTubeDetail(id,false);
        }else if(data.result==="duplicate"){
            markTubeLiked(id);
            alert(data.message||"이미 추천한 영상입니다.");
            openTubeDetail(id,false);
        }else{
            alert(data.message||"추천 처리 중 오류가 발생했습니다.");
        }
    })
    .catch(()=>alert("추천 처리 중 오류가 발생했습니다."));
}

function unlikeTube(id){
    postTubeApi({
        type:"tube_unlike",
        id:id,
        client_id:getTubeLikeClientId()
    })
    .then(data=>{
        if(data.result==="success"){
            unmarkTubeLiked(id);
            const target=findTubeById(id);
            if(target)target.likes=Math.max(0,Number(target.likes||0)-1);
            openTubeDetail(id,false);
        }else if(data.result==="not_found"){
            unmarkTubeLiked(id);
            openTubeDetail(id,false);
        }else{
            alert(data.message||"추천 취소 중 오류가 발생했습니다.");
        }
    })
    .catch(()=>alert("추천 취소 중 오류가 발생했습니다."));
}


function toggleTubeDislike(id){
    if(hasDislikedTube(id)){undislikeTube(id);return;}
    dislikeTube(id);
}
function dislikeTube(id){
    postTubeApi({type:"tube_dislike",id:id,client_id:getTubeLikeClientId()})
    .then(data=>{
        if(data.result==="success"){
            const wasLiked=hasLikedTube(id);
            markTubeDisliked(id);
            unmarkTubeLiked(id);
            const target=findTubeById(id);
            if(target){
                target.dislikes=Number(target.dislikes||0)+1;
                if(wasLiked)target.likes=Math.max(0,Number(target.likes||0)-1);
            }
            openTubeDetail(id,false);
        }else if(data.result==="duplicate"){
            markTubeDisliked(id);
            openTubeDetail(id,false);
        }else{alert(data.message||"비추천 처리 중 오류가 발생했습니다.");}
    }).catch(()=>alert("비추천 처리 중 오류가 발생했습니다."));
}
function undislikeTube(id){
    postTubeApi({type:"tube_undislike",id:id,client_id:getTubeLikeClientId()})
    .then(data=>{
        if(data.result==="success"){
            unmarkTubeDisliked(id);
            const target=findTubeById(id);
            if(target)target.dislikes=Math.max(0,Number(target.dislikes||0)-1);
            openTubeDetail(id,false);
        }else if(data.result==="not_found"){
            unmarkTubeDisliked(id);
            openTubeDetail(id,false);
        }else{alert(data.message||"비추천 취소 중 오류가 발생했습니다.");}
    }).catch(()=>alert("비추천 취소 중 오류가 발생했습니다."));
}

    return comments.filter(c=>String(c.parent_comment_id||"")===String(parentId));

function toggleCommentReplyForm(formId){
    const form=document.getElementById(formId);
    if(!form)return;
    form.classList.toggle("active");
}

function renderReplyForm(scope,ownerId,parentCommentId){
    const prefix=scope+"Reply_"+String(parentCommentId).replace(/[^a-zA-Z0-9_\-]/g,"_");
    const addFn=scope==="board"?"addBoardComment":"addTubeComment";
    return `<div class="comment-reply-form" id="${prefix}Form">
        <input class="comment-input" id="${prefix}Writer" placeholder="작성자">
        <input class="comment-input" id="${prefix}Password" type="password" placeholder="삭제 비밀번호">
        <textarea class="comment-textarea" id="${prefix}Content" placeholder="답글을 입력하세요"></textarea>
        <button class="comment-submit" onclick="${addFn}('${escapeText(ownerId)}','${escapeText(parentCommentId)}','${prefix}')">등록</button>
    </div>`;
}

function renderCommentItem(scope,ownerId,comment,index,allComments,isReply){
    const commentId=scope==="board"?getCommentId(comment,index):getTubeCommentId(comment,index);
    const liked=hasLikedComment(scope,commentId);
    const disliked=hasDislikedComment(scope,commentId);
    const deleteFn=scope==="board"?"deleteBoardComment":"deleteTubeComment";
    const likeFn=scope==="board"?"toggleBoardCommentLike":"toggleTubeCommentLike";
    const dislikeFn=scope==="board"?"toggleBoardCommentDislike":"toggleTubeCommentDislike";
    const formId=scope+"Reply_"+String(commentId).replace(/[^a-zA-Z0-9_\-]/g,"_")+"Form";
    const replies=getReplyComments(allComments,commentId);
    const replyHtml=replies.map((reply,replyIndex)=>renderCommentItem(scope,ownerId,reply,replyIndex,allComments,true)).join("");
    return `<div class="comment-item ${isReply?"reply":""}">
        <div class="comment-meta">
            <div><span class="comment-writer">${safe(comment.writer||"익명")}</span> · ${comment.updated_at?`수정 ${formatDate(comment.updated_at)}`:formatDate(comment.date)}</div>
            <div class="comment-actions">
                <span class="comment-reaction-group">
                    <button class="comment-reaction-btn like ${liked?"active":""}" onclick="${likeFn}('${escapeText(commentId)}','${escapeText(ownerId)}')" title="추천">👍 <span>${Number(comment.likes||0)}</span></button>
                    <button class="comment-reaction-btn dislike ${disliked?"active":""}" onclick="${dislikeFn}('${escapeText(commentId)}','${escapeText(ownerId)}')" title="비추천">👎 <span>${Number(comment.dislikes||0)}</span></button>
                </span>
                ${!isReply?`<button class="comment-mini-btn" onclick="toggleCommentReplyForm('${formId}')">답글</button>`:""}
                <button class="comment-mini-btn" onclick="startEditComment('${scope}','${escapeText(commentId)}','${escapeText(ownerId)}')">수정</button>
                <button class="comment-mini-btn danger" onclick="${deleteFn}('${escapeText(commentId)}','${escapeText(ownerId)}')">삭제</button>
            </div>
        </div>
        <div class="comment-content" id="commentContent_${scope}_${domSafeId(commentId)}">${safe(comment.content)}</div>
        <div id="commentEdit_${scope}_${domSafeId(commentId)}"></div>
        ${!isReply?renderReplyForm(scope,ownerId,commentId):""}
        ${replyHtml}
    </div>`;
}

function startEditComment(scope,commentId,ownerId){
    const isBoard=scope==="board";
    const list=isBoard?boardComments:tubeComments;
    const getId=isBoard?getCommentId:getTubeCommentId;
    const target=list.find((comment,index)=>getId(comment,index)===String(commentId));
    if(!target){alert("댓글을 찾을 수 없습니다.");return;}

    const box=document.getElementById(`commentEdit_${scope}_${domSafeId(commentId)}`);
    const contentBox=document.getElementById(`commentContent_${scope}_${domSafeId(commentId)}`);
    if(!box)return;

    if(contentBox)contentBox.style.display="none";
    box.innerHTML=`
        <div class="comment-edit-form">
            <textarea class="comment-textarea" id="commentEditContent_${scope}_${domSafeId(commentId)}" placeholder="댓글 내용을 수정하세요">${escapeTextarea(target.content||"")}</textarea>
            <input class="comment-input" id="commentEditPassword_${scope}_${domSafeId(commentId)}" type="password" placeholder="수정 비밀번호">
            <div class="inline-edit-help">작성할 때 입력한 삭제 비밀번호와 같아야 수정됩니다.</div>
            <div class="comment-edit-actions">
                <button class="board-action-btn" onclick="submitEditComment('${scope}','${escapeText(commentId)}','${escapeText(ownerId)}')">저장</button>
                <button class="board-action-btn danger" onclick="cancelEditComment('${scope}','${escapeText(commentId)}')">취소</button>
            </div>
        </div>`;
}

function cancelEditComment(scope,commentId){
    const box=document.getElementById(`commentEdit_${scope}_${domSafeId(commentId)}`);
    const contentBox=document.getElementById(`commentContent_${scope}_${domSafeId(commentId)}`);
    if(box)box.innerHTML="";
    if(contentBox)contentBox.style.display="";
}

function submitEditComment(scope,commentId,ownerId){
    const isBoard=scope==="board";
    const contentEl=document.getElementById(`commentEditContent_${scope}_${domSafeId(commentId)}`);
    const passwordEl=document.getElementById(`commentEditPassword_${scope}_${domSafeId(commentId)}`);
    const content=contentEl?contentEl.value.trim():"";
    const password=passwordEl?passwordEl.value.trim():"";

    if(!content){alert("댓글 내용은 비울 수 없습니다.");return;}
    if(!password){alert("비밀번호를 입력해야 수정할 수 있습니다.");return;}

    const api=isBoard?postBoardApi:postTubeApi;
    const payload=isBoard
        ? {type:"board_comment_update",comment_id:commentId,password:password,content:content}
        : {type:"tube_comment_update",comment_id:commentId,password:password,content:content};

    api(payload)
    .then(data=>{
        if(data.result==="success"){
            const list=isBoard?boardComments:tubeComments;
            const getId=isBoard?getCommentId:getTubeCommentId;
            const target=list.find((comment,index)=>getId(comment,index)===String(commentId));
            if(target){
                target.content=content;
                target.updated_at=data.updated_at||new Date().toISOString();
            }
            if(isBoard){openBoardDetail(ownerId);}else{openTubeDetail(ownerId,false);}
        }else{
            alert(data.message||"댓글 수정 중 오류가 발생했습니다.");
        }
    })
    .catch(()=>alert("댓글 수정 중 오류가 발생했습니다."));
}

function renderTubeCommentsHtml(tubeId){
    const comments=getCommentsByTube(tubeId);
    if(!comments.length)return `<div class="ready">등록된 댓글이 없습니다.</div>`;

    const roots=getRootComments(comments);
    return roots.map((comment,index)=>renderCommentItem("tube",tubeId,comment,index,comments,false)).join("");
}

function addTubeComment(tubeId,parentCommentId="",inputPrefix=""){
    const writerEl=document.getElementById(inputPrefix?inputPrefix+"Writer":"tubeCommentWriter");
    const passwordEl=document.getElementById(inputPrefix?inputPrefix+"Password":"tubeCommentPassword");
    const contentEl=document.getElementById(inputPrefix?inputPrefix+"Content":"tubeCommentContent");
    const writer=writerEl?writerEl.value.trim()||"익명":"익명";
    const password=passwordEl?passwordEl.value.trim():"";
    const content=contentEl?contentEl.value.trim():"";

    if(!content||!password){
        alert("댓글 내용과 삭제 비밀번호를 입력해주세요.");
        return;
    }

    postTubeApi({
        type:"tube_comment_add",
        tube_id:tubeId,
        parent_comment_id:parentCommentId||"",
        writer:writer,
        content:content,
        password:password
    })
    .then(data=>{
        if(data.result==="success"){
            tubeComments.push({
                comment_id:data.comment_id||String(Date.now()),
                tube_id:tubeId,
                parent_comment_id:parentCommentId||"",
                writer:writer,
                content:content,
                date:data.date||new Date().toISOString(),
                likes:0,
                dislikes:0,
                updated_at:""
            });
            openTubeDetail(tubeId,false);
        }else{
            alert(data.message||"댓글 등록 중 오류가 발생했습니다.");
        }
    })
    .catch(()=>alert("댓글 등록 중 오류가 발생했습니다."));
}

function deleteTubeComment(commentId,tubeId){
    const password=prompt("댓글 삭제 비밀번호를 입력하세요. 원댓글을 삭제하면 대댓글도 함께 삭제됩니다.");
    if(password===null)return;
    if(!password.trim()){alert("비밀번호를 입력해야 삭제할 수 있습니다.");return;}

    postTubeApi({type:"tube_comment_delete",comment_id:commentId,password:password.trim()})
    .then(data=>{
        if(data.result==="success"){
            const deleted=(data.deleted_comment_ids||[commentId]).map(String);
            tubeComments=tubeComments.filter((comment,index)=>!deleted.includes(getTubeCommentId(comment,index)));
            deleted.forEach(id=>{unmarkCommentLiked("tube",id);unmarkCommentDisliked("tube",id);});
            openTubeDetail(tubeId,false);
        }else{
            alert(data.message||"댓글 삭제 중 오류가 발생했습니다.");
        }
    })
    .catch(()=>alert("댓글 삭제 중 오류가 발생했습니다."));
}

function toggleTubeCommentLike(commentId,tubeId){
    if(hasLikedComment("tube",commentId)){
        unlikeTubeComment(commentId,tubeId);
        return;
    }
    likeTubeComment(commentId,tubeId);
}

function likeTubeComment(commentId,tubeId){
    postTubeApi({
        type:"tube_comment_like",
        comment_id:commentId,
        client_id:getCommentLikeClientId("tube")
    })
    .then(data=>{
        if(data.result==="success"){
            markCommentLiked("tube",commentId);
            const target=tubeComments.find((comment,index)=>getTubeCommentId(comment,index)===String(commentId));
            if(target){
                const wasDisliked=hasDislikedComment("tube",commentId);
                target.likes=Number(target.likes||0)+1;
                if(wasDisliked)target.dislikes=Math.max(0,Number(target.dislikes||0)-1);
            }
            unmarkCommentDisliked("tube",commentId);
            openTubeDetail(tubeId,false);
        }else if(data.result==="duplicate"){
            markCommentLiked("tube",commentId);
            alert(data.message||"이미 추천한 댓글입니다.");
            openTubeDetail(tubeId,false);
        }else{
            alert(data.message||"댓글 추천 처리 중 오류가 발생했습니다.");
        }
    })
    .catch(()=>alert("댓글 추천 처리 중 오류가 발생했습니다."));
}

function unlikeTubeComment(commentId,tubeId){
    postTubeApi({
        type:"tube_comment_unlike",
        comment_id:commentId,
        client_id:getCommentLikeClientId("tube")
    })
    .then(data=>{
        if(data.result==="success"){
            unmarkCommentLiked("tube",commentId);
            const target=tubeComments.find((comment,index)=>getTubeCommentId(comment,index)===String(commentId));
            if(target)target.likes=Math.max(0,Number(target.likes||0)-1);
            openTubeDetail(tubeId,false);
        }else if(data.result==="not_found"){
            unmarkCommentLiked("tube",commentId);
            openTubeDetail(tubeId,false);
        }else{
            alert(data.message||"댓글 추천 취소 중 오류가 발생했습니다.");
        }
    })
    .catch(()=>alert("댓글 추천 취소 중 오류가 발생했습니다."));
}


function toggleTubeCommentDislike(commentId,tubeId){
    if(hasDislikedComment("tube",commentId)){undislikeTubeComment(commentId,tubeId);return;}
    dislikeTubeComment(commentId,tubeId);
}
function dislikeTubeComment(commentId,tubeId){
    postTubeApi({type:"tube_comment_dislike",comment_id:commentId,client_id:getCommentLikeClientId("tube")})
    .then(data=>{
        if(data.result==="success"){
            const wasLiked=hasLikedComment("tube",commentId);
            markCommentDisliked("tube",commentId);
            unmarkCommentLiked("tube",commentId);
            const target=tubeComments.find((comment,index)=>getTubeCommentId(comment,index)===String(commentId));
            if(target){
                target.dislikes=Number(target.dislikes||0)+1;
                if(wasLiked)target.likes=Math.max(0,Number(target.likes||0)-1);
            }
            openTubeDetail(tubeId,false);
        }else if(data.result==="duplicate"){
            markCommentDisliked("tube",commentId);
            openTubeDetail(tubeId,false);
        }else{alert(data.message||"댓글 비추천 처리 중 오류가 발생했습니다.");}
    }).catch(()=>alert("댓글 비추천 처리 중 오류가 발생했습니다."));
}
function undislikeTubeComment(commentId,tubeId){
    postTubeApi({type:"tube_comment_undislike",comment_id:commentId,client_id:getCommentLikeClientId("tube")})
    .then(data=>{
        if(data.result==="success"){
            unmarkCommentDisliked("tube",commentId);
            const target=tubeComments.find((comment,index)=>getTubeCommentId(comment,index)===String(commentId));
            if(target)target.dislikes=Math.max(0,Number(target.dislikes||0)-1);
            openTubeDetail(tubeId,false);
        }else if(data.result==="not_found"){
            unmarkCommentDisliked("tube",commentId);
            openTubeDetail(tubeId,false);
        }else{alert(data.message||"댓글 비추천 취소 중 오류가 발생했습니다.");}
    }).catch(()=>alert("댓글 비추천 취소 중 오류가 발생했습니다."));
}

function submitTubePostEdit(id){
    const target=findTubeById(id);
    if(!target){alert("영상 게시글을 찾을 수 없습니다.");return;}

    const title=document.getElementById("tubeEditTitle").value.trim();
    const url=document.getElementById("tubeEditUrl").value.trim();
    const thumbnail=document.getElementById("tubeEditThumbnail").value.trim();
    const category=document.getElementById("tubeEditCategory").value.trim()||"일반";
    const content=document.getElementById("tubeEditContent").value.trim();
    const password=document.getElementById("tubeEditPassword").value.trim();

    if(!title||!url){alert("영상 제목과 유튜브 링크는 비울 수 없습니다.");return;}
    if(!url.includes("youtube.com")&&!url.includes("youtu.be")){alert("유튜브 링크를 입력해주세요.");return;}
    if(!password){alert("비밀번호를 입력해야 수정할 수 있습니다.");return;}

    postTubeApi({
        type:"tube_update",
        id:id,
        password:password,
        title:title,
        url:url,
        thumbnail:thumbnail,
        category:category,
        content:content
    })
    .then(data=>{
        if(data.result==="success"){
            target.title=title;
            target.url=url;
            target.thumbnail=thumbnail;
            target.category=category;
            target.content=content;
            target.updated_at=data.updated_at||new Date().toISOString();
            openTubeDetail(id,false);
        }else{
            alert(data.message||"영상 게시글 수정 중 오류가 발생했습니다.");
        }
    })
    .catch(()=>alert("영상 게시글 수정 중 오류가 발생했습니다."));
}

function deleteTubePost(id){
    const password=prompt("영상 게시글 삭제 비밀번호를 입력하세요. 삭제하면 댓글도 함께 삭제됩니다.");
    if(password===null)return;
    if(!password.trim()){alert("비밀번호를 입력해야 삭제할 수 있습니다.");return;}

    postTubeApi({type:"tube_delete",id:id,password:password.trim()})
    .then(data=>{
        if(data.result==="success"){
            tubes=tubes.filter((tube,index)=>getTubeId(tube,index)!==String(id));
            tubeComments=tubeComments.filter(comment=>String(comment.tube_id)!==String(id));
            showTube();
        }else{
            alert(data.message||"영상 게시글 삭제 중 오류가 발생했습니다.");
        }
    })
    .catch(()=>alert("영상 게시글 삭제 중 오류가 발생했습니다."));
}

function getBoardId(post,index){
    return String(post.id||post.title||index);
}

function getSortedBoards(){
    return boards.slice().sort((a,b)=>{
        const ao=Number(a.order||0);
        const bo=Number(b.order||0);
        if(ao||bo)return ao-bo;
        const ad=new Date(a.date||0).getTime()||0;
        const bd=new Date(b.date||0).getTime()||0;
        return bd-ad;
    });
}

function getCommentId(comment,index){
    return String(comment.comment_id||comment.id||index);
}

function getCommentsByPost(postId){
    return boardComments.filter(c=>String(c.post_id)===String(postId)).sort((a,b)=>{
        const ad=new Date(a.date||0).getTime()||0;
        const bd=new Date(b.date||0).getTime()||0;
        return ad-bd;
    });
}

function postBoardApi(payload){
    return fetch(API_URL,{method:"POST",body:JSON.stringify(payload)}).then(res=>res.json());
}

function openBoardForm(){
    document.getElementById("boardFormModal").classList.add("active");
}

function closeBoardForm(){
    document.getElementById("boardFormModal").classList.remove("active");
}

function closeBoardFormOutside(event){
    if(event.target.id==="boardFormModal")closeBoardForm();
}

function clearBoardForm(){
    document.getElementById("boardWriter").value="";
    document.getElementById("boardTitle").value="";
    document.getElementById("boardCategory").value="일반";
    document.getElementById("boardContent").value="";
    document.getElementById("boardPassword").value="";
}

function submitBoardPost(){
    const writer=document.getElementById("boardWriter").value.trim();
    const title=document.getElementById("boardTitle").value.trim();
    const category=document.getElementById("boardCategory").value.trim()||"일반";
    const content=document.getElementById("boardContent").value.trim();
    const password=document.getElementById("boardPassword").value.trim();

    if(!writer||!title||!content||!password){
        alert("작성자, 제목, 내용, 삭제 비밀번호는 필수입니다.");
        return;
    }

    postBoardApi({
        type:"board_post",
        writer:writer,
        title:title,
        category:category,
        content:content,
        password:password
    })
    .then(data=>{
        if(data.result==="success"){
            alert("게시글이 등록되었습니다.");
            const newPost={
                id:data.id||String(Date.now()),
                date:data.date||new Date().toISOString(),
                writer:writer,
                title:title,
                category:category,
                content:content,
                order:"",
                views:0,
                likes:0,
                dislikes:0,
                updated_at:""
            };
            boards.unshift(newPost);
            clearBoardForm();
            closeBoardForm();
            showBoard();
            openBoardDetail(getBoardId(newPost,0));
        }else{
            alert("등록 중 오류가 발생했습니다.");
        }
    })
    .catch(()=>{
        alert("등록 중 오류가 발생했습니다.");
    });
}

function showBoard(){
    enterMainSection("board");
    setMainActive(4);
    selectedBoardId="";
    const list=getSortedBoards();

    document.getElementById("content").innerHTML=`
        <div class="section-head">
            <div>
                <div class="section-title">자유게시판</div>
                <div class="section-desc">AXE 구성원들이 자유롭게 글을 남기는 공간입니다.</div>
            </div>
            <div class="count">${list.length}개</div>

            <button class="tube-submit-open" onclick="openBoardForm()">글쓰기</button>
        </div>

function renderBoardList(){
    const box=document.getElementById("boardListBox");
    if(!box)return;

    const list=getSortedBoards();
    if(!list.length){
        box.innerHTML=`<div class="ready">등록된 게시글이 없습니다.</div>`;
        return;
    }

    box.innerHTML=list.map((post,index)=>{
        const id=getBoardId(post,index);
        const commentCount=getCommentsByPost(id).length;
        const title=safe(post.title)+(commentCount?` <span class="board-comment-count-badge">💬 ${commentCount}</span>`:"");
        return `<div class="board-table-row ${selectedBoardId===id?"active":""}" onclick="openBoardDetail('${escapeText(id)}',true,true)">
            <div class="board-table-title">${title}</div>
            <div class="board-table-cell">${safe(post.writer)}</div>
            <div class="board-table-cell">${formatDate(post.date)}</div>
            <div class="board-table-cell">${Number(post.views||0)}</div>
            <div class="board-table-cell">👍 ${Number(post.likes||0)}</div>
        </div>`;
    }).join("");
}

function findBoardPostById(id){
    const list=getSortedBoards();
    for(let i=0;i<list.length;i++){
        if(getBoardId(list[i],i)===String(id))return list[i];
    }
    return null;
}

function renderBoardCommentsHtml(postId){
    const comments=getCommentsByPost(postId);
    if(!comments.length)return `<div class="ready">등록된 댓글이 없습니다.</div>`;

    const roots=getRootComments(comments);
    return roots.map((comment,index)=>renderCommentItem("board",postId,comment,index,comments,false)).join("");
}

function addBoardComment(postId,parentCommentId="",inputPrefix=""){
    const writerEl=document.getElementById(inputPrefix?inputPrefix+"Writer":"commentWriter");
    const passwordEl=document.getElementById(inputPrefix?inputPrefix+"Password":"commentPassword");
    const contentEl=document.getElementById(inputPrefix?inputPrefix+"Content":"commentContent");
    const writer=writerEl?writerEl.value.trim()||"익명":"익명";
    const password=passwordEl?passwordEl.value.trim():"";
    const content=contentEl?contentEl.value.trim():"";

    if(!content||!password){
        alert("댓글 내용과 삭제 비밀번호를 입력해주세요.");
        return;
    }

    postBoardApi({
        type:"board_comment_add",
        post_id:postId,
        parent_comment_id:parentCommentId||"",
        writer:writer,
        content:content,
        password:password
    })
    .then(data=>{
        if(data.result==="success"){
            boardComments.push({
                comment_id:data.comment_id||String(Date.now()),
                post_id:postId,
                parent_comment_id:parentCommentId||"",
                writer:writer,
                content:content,
                date:data.date||new Date().toISOString(),
                likes:0,
                dislikes:0,
                updated_at:""
            });
            openBoardDetail(postId);
        }else{
            alert("댓글 등록 중 오류가 발생했습니다.");
        }
    })
    .catch(()=>alert("댓글 등록 중 오류가 발생했습니다."));
}

function deleteBoardComment(commentId,postId){
    const password=prompt("댓글 삭제 비밀번호를 입력하세요. 원댓글을 삭제하면 대댓글도 함께 삭제됩니다.");
    if(password===null)return;
    if(!password.trim()){alert("비밀번호를 입력해야 삭제할 수 있습니다.");return;}

    postBoardApi({type:"board_comment_delete",comment_id:commentId,password:password.trim()})
    .then(data=>{
        if(data.result==="success"){
            const deleted=(data.deleted_comment_ids||[commentId]).map(String);
            boardComments=boardComments.filter((comment,index)=>!deleted.includes(getCommentId(comment,index)));
            deleted.forEach(id=>{unmarkCommentLiked("board",id);unmarkCommentDisliked("board",id);});
            openBoardDetail(postId);
        }else{
            alert(data.message||"댓글 삭제 중 오류가 발생했습니다.");
        }
    })
    .catch(()=>alert("댓글 삭제 중 오류가 발생했습니다."));
}

    return t||"접두";

    const list=modBooks.filter(m=>normalizeModType(m.type)===modBookTypeFilter);
    return [...new Set(list.map(m=>String(m.category||"기타").trim()||"기타"))];
}

function parseModOption(v){
    let text=String(v||"").trim();
    if(!text||text==="-")return null;
    let isDebuff=false;
    let isTier1=false;
    while(text.startsWith("*")||text.startsWith("!")){
        if(text.startsWith("*")){isDebuff=true;text=text.slice(1).trim();continue}
        if(text.startsWith("!")){isTier1=true;text=text.slice(1).trim();continue}
    }
    return {text,isDebuff,isTier1};
}

function parseModName(v){
    let text=String(v||"").trim();
    if(!text)return {text:"",isTier1:false,isDebuff:false};
    let isDebuff=false;
    let isTier1=false;
    while(text.startsWith("*")||text.startsWith("!")){
        if(text.startsWith("*")){isDebuff=true;text=text.slice(1).trim();continue}
        if(text.startsWith("!")){isTier1=true;text=text.slice(1).trim();continue}
    }
    return {text,isTier1,isDebuff};
}

function cleanModText(v){
    const opt=parseModOption(v);
    return opt?opt.text:String(v||"").replace(/^[*!]+/,"").trim();
}

function hasTier1Mark(m){
    const name=parseModName(m.name);
    if(name.isTier1)return true;
    return [m.option1,m.option2,m.option3].some(v=>{
        const opt=parseModOption(v);
        return opt&&opt.isTier1;
    });
}

function formatModSuccessRate(v){
    if(v===undefined||v===null||v==="")return "-";
    const raw=String(v).trim();
    if(!raw)return "-";
    if(raw.includes("%"))return raw;
    const n=Number(raw);
    if(!isNaN(n)){
        if(n>0&&n<=1)return `${Math.round(n*100)}%`;
        return `${n}%`;
    }
    return raw;
}


function formatModPrice(v){
    if(v===undefined||v===null||v==="")return "";
    const raw=String(v).trim().replace(/,/g,"");
    if(!raw)return "";
    const n=Number(raw);
    if(!isNaN(n))return `${Math.round(n).toLocaleString()}$`;
    return String(v).trim();
}

function hasRecentPrice(m){
    return m.recent_price!==undefined&&m.recent_price!==null&&String(m.recent_price).trim()!=="";
}

function renderModRecentPrice(m){

    const price=formatModPrice(m.recent_price);

function renderModOption(v){
    const opt=parseModOption(v);

function getFilteredModBooks(){

    if(keyword){
        list=list.filter(m=>[
            parseModName(m.name).text,
            m.parts,
            cleanModText(m.option1),
            cleanModText(m.option2),
            cleanModText(m.option3),
            formatModSuccessRate(m.success_rate),
            formatModPrice(m.recent_price),
            formatDate(m.recent_date),
            m.price_note,
            m.note,
            m.category,
            m.type
        ].join(" ").toLowerCase().includes(keyword));
    }else{
        list=list.filter(m=>normalizeModType(m.type)===modBookTypeFilter);
        if(modBookCategoryFilter)list=list.filter(m=>String(m.category||"기타").trim()===modBookCategoryFilter);
    }

    return list.slice().sort((a,b)=>{
        const ta=normalizeModType(a.type).localeCompare(normalizeModType(b.type),"ko");
        if(keyword&&ta!==0)return ta;
        const ca=String(a.category||"").localeCompare(String(b.category||""),"ko");
        if(keyword&&ca!==0)return ca;
        return Number(a.order||999999)-Number(b.order||999999);
    });
}

function numValue(v, fallback=0){
    if(v===undefined||v===null||v==="")return fallback;
    const n=Number(String(v).replace(/,/g,""));
    return isNaN(n)?fallback:n;
}

function cleanName(v){
    return String(v||"").trim();
}

function addTotal(map,name,qty,tag){
    const key=cleanName(name);
    if(!key||qty<=0)return;
    if(!map[key])map[key]={name:key,qty:0,tags:new Set()};
    map[key].qty+=qty;
    if(tag)map[key].tags.add(tag);
}

function findMaterialRecipe(name){
    const target=cleanName(name);
    return materialRecipes.find(r=>cleanName(r.item_name)===target);
}

function findProcessRecipe(name){
    const target=cleanName(name);
    return processes.find(r=>cleanName(r.item_name)===target);
}

function getRecipeInputs(row){
    const list=[];
    for(let i=1;i<=3;i++){
        const name=cleanName(row[`input${i}`]);
        const qty=numValue(row[`input${i}_qty`],0);
        if(name&&qty>0)list.push({name,qty});
    }
    return list;
}

function getProcessInputs(row){
    const list=[];
    const input1=cleanName(row.input1);
    const input1Qty=numValue(row.input1_qty,0);
    const input2=cleanName(row.input2);
    const input2Qty=numValue(row.input2_qty,0);
    if(input1&&input1Qty>0)list.push({name:input1,qty:input1Qty});
    if(input2&&input2Qty>0)list.push({name:input2,qty:input2Qty});
    return list;
}

function expandToRawMaterials(name,qty,depth,trail,breakdowns){
    const clean=cleanName(name);
    const amount=numValue(qty,0);
    if(!clean||amount<=0)return [];
    if(depth>8||trail.includes(clean))return [{name:clean,qty:amount,tag:"직접 준비"}];

    const recipe=findMaterialRecipe(clean);
    if(recipe){
        const inputs=getRecipeInputs(recipe);
        if(inputs.length){
            breakdowns.push({target:clean,qty:amount,inputs:inputs.map(i=>`${i.name} x${formatQty(i.qty*amount)}`).join(" + ")});
            return inputs.flatMap(input=>expandToRawMaterials(input.name,input.qty*amount,depth+1,[...trail,clean],breakdowns));
        }
    }

    const process=findProcessRecipe(clean);
    if(process){
        const inputs=getProcessInputs(process);
        const outputQty=Math.max(1,numValue(process.output_qty,1));
        const runs=Math.ceil(amount/outputQty);
        if(inputs.length){
            breakdowns.push({target:clean,qty:amount,inputs:inputs.map(i=>`${i.name} x${formatQty(i.qty*runs)}`).join(" + ")});
            return inputs.flatMap(input=>expandToRawMaterials(input.name,input.qty*runs,depth+1,[...trail,clean],breakdowns));
        }
    }

    return [{name:clean,qty:amount,tag:"직접 준비"}];
}

function formatQty(v){
    const n=numValue(v,0);
    if(Number.isInteger(n))return n.toLocaleString();
    return n.toLocaleString(undefined,{maximumFractionDigits:2});
}

function buildFinalMaterialInfo(itemMaterials){
    const totals={};
    const breakdowns=[];
    itemMaterials.forEach(m=>{
        const name=cleanName(m.material_name);
        const qty=numValue(m.quantity,0);
        const raws=expandToRawMaterials(name,qty,0,[],breakdowns);
        raws.forEach(r=>addTotal(totals,r.name,r.qty,r.tag));
    });
    return {
        totals:Object.values(totals).sort((a,b)=>a.name.localeCompare(b.name,"ko")),
        breakdowns
    };
}

function renderFinalMaterials(itemMaterials){
    if(!itemMaterials.length)return "";
    const info=buildFinalMaterialInfo(itemMaterials);
    if(!info.totals.length)return "";

    const preview=info.totals.slice(0,4).map(m=>`${safe(m.name)} x${formatQty(m.qty)}`).join(" · ");
    const moreCount=Math.max(info.totals.length-4,0);
    const summary=moreCount>0?`${preview} 외 ${moreCount}종`:preview;

    const totalHtml=info.totals.map(m=>`
        <div class="final-material-card">
            <div class="final-material-name">${safe(m.name)}${m.tags.size?`<span class="final-material-tag">${Array.from(m.tags).join(", ")}</span>`:""}</div>
            <div class="final-material-qty">x${formatQty(m.qty)}</div>
        </div>
    `).join("");

    const breakdownHtml=info.breakdowns.length?`
        <div class="recipe-breakdown">
            <div class="recipe-breakdown-title">계산 기준</div>
            ${info.breakdowns.map(b=>`
                <div class="recipe-breakdown-row">
                    <strong>${safe(b.target)} x${formatQty(b.qty)}</strong>
                    <span>${safe(b.inputs)}</span>
                </div>
            `).join("")}
        </div>
    `:"";

    return `
        <div class="final-material-section">
            <div class="final-material-toggle" onclick="toggleFinalMaterials()">
                <div class="final-material-toggle-left">
                    <div class="final-material-toggle-title">최종 원재료 ${info.totals.length}종</div>
                    <div class="final-material-toggle-summary">${summary}</div>
                </div>
                <div class="final-material-toggle-action" id="finalMaterialToggleText">보기 ▼</div>
            </div>
            <div class="final-material-detail" id="finalMaterialDetail">
                <div class="final-material-grid">${totalHtml}</div>
                ${breakdownHtml}
            </div>
        </div>
    `;
}
