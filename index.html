<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXE 정보센터</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(0, 230, 118, 0.12), transparent 35%),
        radial-gradient(circle at top right, rgba(255, 215, 0, 0.08), transparent 30%),
        linear-gradient(180deg, #050505 0%, #0b0b0b 45%, #050505 100%);
    color: #fff;
    font-family: Arial, sans-serif;
}

.wrap {
    max-width: 1220px;
    margin: auto;
    padding: 34px 18px 60px;
}

/* 상단 */
.hero {
    border: 1px solid rgba(255,255,255,0.08);
    background:
        linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
        linear-gradient(145deg, #151515, #090909);
    border-radius: 24px;
    padding: 28px;
    margin-bottom: 22px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.35);
}

.hero-top {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
}

.logo-block {
    display: flex;
    gap: 14px;
    align-items: center;
}

.logo {
    width: 54px;
    height: 54px;
    border-radius: 16px;
    background:
        linear-gradient(145deg, #00e676, #0a7f45);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #021408;
    font-weight: 900;
    font-size: 20px;
    box-shadow: 0 0 28px rgba(0,230,118,0.25);
}

h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -0.5px;
}

.sub {
    color: #a8a8a8;
    margin-top: 6px;
    font-size: 14px;
}

.status {
    border: 1px solid rgba(0,230,118,0.35);
    color: #00e676;
    background: rgba(0,230,118,0.08);
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 13px;
    white-space: nowrap;
}

.hero-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 24px;
}

.info-chip {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 14px;
}

.info-label {
    color: #8c8c8c;
    font-size: 12px;
    margin-bottom: 6px;
}

.info-value {
    font-weight: 800;
    font-size: 17px;
}

/* 메뉴 */
.menu {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 22px;
}

.menu-card {
    background: rgba(20,20,20,0.88);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 15px 12px;
    cursor: pointer;
    transition: 0.16s ease;
    text-align: center;
    color: #bbb;
}

.menu-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.18);
    background: rgba(28,28,28,0.95);
    color: #fff;
}

.menu-card.active-menu {
    border-color: rgba(0,230,118,0.7);
    color: #00e676;
    background: rgba(0,230,118,0.08);
}

.menu-title {
    font-size: 14px;
    font-weight: 800;
}

/* 콘텐츠 패널 */
.panel {
    background: rgba(12,12,12,0.82);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.28);
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 16px;
    margin-bottom: 18px;
}

.section-title {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: -0.4px;
}

.section-desc {
    color: #888;
    font-size: 13px;
    margin-top: 5px;
}

.count-badge {
    color: #00e676;
    background: rgba(0,230,118,0.08);
    border: 1px solid rgba(0,230,118,0.25);
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 13px;
    white-space: nowrap;
}

/* 검색 */
.search-wrap {
    margin: 16px 0 16px;
}

.search-box {
    position: relative;
}

.search-box input {
    width: 100%;
    height: 56px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.1);
    background:
        linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    color: #fff;
    font-size: 16px;
    padding: 0 54px 0 50px;
    outline: none;
    transition: 0.15s ease;
}

.search-box input:focus {
    border-color: rgba(0,230,118,0.75);
    box-shadow: 0 0 0 4px rgba(0,230,118,0.08);
}

.search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #00e676;
    font-size: 19px;
}

.clear-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    background: #252525;
    color: #aaa;
    cursor: pointer;
    display: none;
}

/* 필터 */
.filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0 18px;
}

.filter button {
    background: rgba(255,255,255,0.04);
    color: #ccc;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 9px 14px;
    cursor: pointer;
    transition: 0.15s ease;
    font-weight: 700;
}

.filter button:hover {
    background: rgba(255,255,255,0.08);
}

.filter button.active {
    border-color: rgba(0,230,118,0.65);
    color: #00e676;
    background: rgba(0,230,118,0.08);
}

.result-info {
    color: #888;
    font-size: 13px;
    margin-bottom: 14px;
}

/* 카드 */
.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    align-items: start;
}

.card {
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(145deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018)),
        #111;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px;
    padding: 18px;
    cursor: pointer;
    transition: 0.16s ease;
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(0,230,118,0.12), transparent 38%);
    opacity: 0;
    transition: 0.16s ease;
    pointer-events: none;
}

.card:hover {
    transform: translateY(-3px);
    border-color: rgba(0,230,118,0.38);
}

.card:hover::before {
    opacity: 1;
}

.card-inner {
    position: relative;
    z-index: 1;
}

.item-name {
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 12px;
    letter-spacing: -0.2px;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 13px;
}

.badge {
    font-size: 12px;
    padding: 6px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #ddd;
    font-weight: 700;
}

.badge.rate {
    color: #00e676;
    border-color: rgba(0,230,118,0.35);
    background: rgba(0,230,118,0.08);
}

.badge.rank {
    color: #ffd966;
    border-color: rgba(255,217,102,0.32);
    background: rgba(255,217,102,0.08);
}

.meta {
    font-size: 13px;
    color: #999;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    border-top: 1px solid rgba(255,255,255,0.07);
    padding-top: 12px;
}

.open-hint {
    color: #666;
    font-size: 12px;
}

/* 재료 */
.materials {
    display: none;
    margin-top: 15px;
    padding: 14px;
    background: rgba(0,0,0,0.34);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
}

.material-title {
    font-size: 14px;
    font-weight: 900;
    margin-bottom: 10px;
    color: #fff;
}

.material-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    color: #ddd;
    font-size: 14px;
}

.material-row:last-child {
    border-bottom: none;
}

.qty {
    color: #00e676;
    font-weight: 900;
    white-space: nowrap;
}

/* 준비중 */
.empty {
    color: #999;
    padding: 26px;
    border: 1px dashed rgba(255,255,255,0.14);
    border-radius: 18px;
    background: rgba(255,255,255,0.03);
}

/* 반응형 */
@media (max-width: 980px) {
    .menu {
        grid-template-columns: repeat(3, 1fr);
    }

    .grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .hero-info {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 620px) {
    .wrap {
        padding: 22px 14px 40px;
    }

    .hero {
        padding: 22px;
    }

    .hero-top {
        display: block;
    }

    .status {
        display: inline-block;
        margin-top: 14px;
    }

    h1 {
        font-size: 27px;
    }

    .menu {
        grid-template-columns: repeat(2, 1fr);
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .section-head {
        display: block;
    }

    .count-badge {
        display: inline-block;
        margin-top: 10px;
    }
}
</style>
</head>

<body>

<div class="wrap">

    <div class="hero">
        <div class="hero-top">
            <div class="logo-block">
                <div class="logo">AXE</div>
                <div>
                    <h1>AXE 정보센터</h1>
                    <div class="sub">제작 · 시세 · 스킬 · 생활 · 무법지대 정보를 정리하는 회사 데이터 허브</div>
                </div>
            </div>
            <div class="status">LIVE DATA</div>
        </div>

        <div class="hero-info">
            <div class="info-chip">
                <div class="info-label">현재 연결</div>
                <div class="info-value">Google Sheet</div>
            </div>
            <div class="info-chip">
                <div class="info-label">지원 카테고리</div>
                <div class="info-value">제작 정보</div>
            </div>
            <div class="info-chip">
                <div class="info-label">사용 방식</div>
                <div class="info-value">검색 · 필터 · 상세보기</div>
            </div>
        </div>
    </div>

    <div class="menu">
        <div class="menu-card active-menu" onclick="showCraft()">
            <div class="menu-title">제작 정보</div>
        </div>
        <div class="menu-card" onclick="showReady(1)">
            <div class="menu-title">아이템 시세</div>
        </div>
        <div class="menu-card" onclick="showReady(2)">
            <div class="menu-title">스킬</div>
        </div>
        <div class="menu-card" onclick="showReady(3)">
            <div class="menu-title">생활</div>
        </div>
        <div class="menu-card" onclick="showReady(4)">
            <div class="menu-title">무법지대</div>
        </div>
        <div class="menu-card" onclick="showReady(5)">
            <div class="menu-title">상자</div>
        </div>
    </div>

    <div class="panel" id="content"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyGjviirSK0lP3KMP50JkQBZip2eWS6JpGDVWWXDKeljoYhpzuohnKLllpTmja0sYikkw/exec";

let crafts = [];
let materials = [];
let currentCategory = "ALL";
let searchKeyword = "";

fetch(API_URL)
    .then(res => res.json())
    .then(data => {
        crafts = data.crafts || [];
        materials = data.materials || [];
        showCraft();
    })
    .catch(() => {
        document.getElementById("content").innerHTML = `
            <div class="empty">데이터를 불러오지 못했습니다.</div>
        `;
    });

function setActiveMenu(index) {
    document.querySelectorAll(".menu-card").forEach((el, i) => {
        el.classList.toggle("active-menu", i === index);
    });
}

function showCraft() {
    setActiveMenu(0);

    const categories = ["ALL", ...new Set(crafts.map(c => c.category).filter(Boolean))];

    let html = `
        <div class="section-head">
            <div>
                <div class="section-title">제작 정보</div>
                <div class="section-desc">아이템명, 재료명, 분류로 검색하고 카드를 눌러 필요 재료를 확인하세요.</div>
            </div>
            <div class="count-badge" id="countBadge">총 ${crafts.length}개</div>
        </div>

        <div class="search-wrap">
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input
                    id="searchInput"
                    type="text"
                    placeholder="아이템명 또는 재료명 검색"
                    value="${searchKeyword}"
                    oninput="handleSearch(this.value)"
                >
                <button class="clear-btn" id="clearBtn" onclick="clearSearch()">×</button>
            </div>
        </div>

        <div class="filter">
    `;

    categories.forEach(cat => {
        html += `
            <button class="${cat === currentCategory ? "active" : ""}" onclick="filterCraft('${cat}')">
                ${cat}
            </button>
        `;
    });

    html += `
        </div>
        <div class="result-info" id="resultInfo"></div>
        <div class="grid" id="craftGrid"></div>
    `;

    document.getElementById("content").innerHTML = html;
    renderCrafts();
}

function filterCraft(cat) {
    currentCategory = cat;
    showCraft();
}

function handleSearch(value) {
    searchKeyword = value.trim();
    renderCrafts();

    const clearBtn = document.getElementById("clearBtn");
    if (clearBtn) {
        clearBtn.style.display = searchKeyword ? "block" : "none";
    }
}

function clearSearch() {
    searchKeyword = "";
    const input = document.getElementById("searchInput");
    if (input) input.value = "";
    renderCrafts();

    const clearBtn = document.getElementById("clearBtn");
    if (clearBtn) clearBtn.style.display = "none";
}

function renderCrafts() {
    const grid = document.getElementById("craftGrid");
    const resultInfo = document.getElementById("resultInfo");
    const countBadge = document.getElementById("countBadge");
    const clearBtn = document.getElementById("clearBtn");

    if (!grid) return;

    if (clearBtn) {
        clearBtn.style.display = searchKeyword ? "block" : "none";
    }

    let list = currentCategory === "ALL"
        ? crafts
        : crafts.filter(c => c.category === currentCategory);

    const keyword = searchKeyword.toLowerCase();

    if (keyword) {
        list = list.filter(c => {
            const itemMaterials = materials.filter(m => m.craft_id === c.id);

            const targetText = [
                c.item_name,
                c.category,
                c.success_rate,
                c.craft_rank,
                c.obtain_place,
                c.note,
                ...itemMaterials.map(m => m.material_name)
            ].join(" ").toLowerCase();

            return targetText.includes(keyword);
        });
    }

    const categoryText = currentCategory === "ALL" ? "전체" : currentCategory;

    if (resultInfo) {
        resultInfo.textContent = `분류: ${categoryText} · 검색 결과 ${list.length}개`;
    }

    if (countBadge) {
        countBadge.textContent = `${list.length}개 표시`;
    }

    if (list.length === 0) {
        grid.innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`;
        return;
    }

    grid.innerHTML = "";

    list.forEach(c => {
        const itemMaterials = materials.filter(m => m.craft_id === c.id);

        const card = document.createElement("div");
        card.className = "card";

        let matHtml = "";

        if (itemMaterials.length > 0) {
            itemMaterials.forEach(m => {
                matHtml += `
                    <div class="material-row">
                        <span>${m.material_name}</span>
                        <span class="qty">x${m.quantity}</span>
                    </div>
                `;
            });
        } else {
            matHtml = `
                <div class="material-row">
                    <span>등록된 재료 없음</span>
                </div>
            `;
        }

        card.innerHTML = `
            <div class="card-inner">
                <div class="item-name">${c.item_name || "이름 없음"}</div>

                <div class="badges">
                    <span class="badge">${c.category || "-"}</span>
                    <span class="badge rate">성공률 ${c.success_rate || "-"}%</span>
                    <span class="badge rank">랭크 ${c.craft_rank || "-"}</span>
                </div>

                <div class="meta">
                    <span>획득처: ${c.obtain_place || "-"}</span>
                    <span class="open-hint">클릭하여 재료 보기</span>
                </div>

                <div class="materials">
                    <div class="material-title">필요 재료</div>
                    ${matHtml}
                </div>
            </div>
        `;

        card.onclick = () => {
            const matBox = card.querySelector(".materials");
            const hint = card.querySelector(".open-hint");
            const isOpen = matBox.style.display === "block";

            matBox.style.display = isOpen ? "none" : "block";
            hint.textContent = isOpen ? "클릭하여 재료 보기" : "클릭하여 접기";
        };

        grid.appendChild(card);
    });
}

function showReady(index) {
    setActiveMenu(index);

    document.getElementById("content").innerHTML = `
        <div class="section-head">
            <div>
                <div class="section-title">준비중</div>
                <div class="section-desc">아직 연결되지 않은 카테고리입니다.</div>
            </div>
            <div class="count-badge">준비중</div>
        </div>
        <div class="empty">해당 정보는 추후 추가 예정입니다.</div>
    `;
}
</script>

</body>
</html>
