<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXE 정보센터</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0b0b0b;
color:#fff;
font-family:Arial;
}

.wrap{
max-width:1200px;
margin:auto;
padding:20px;
}

.main-menu{
display:flex;
gap:8px;
margin-bottom:20px;
flex-wrap:wrap;
}

.main-menu button{
background:#1a1a1a;
border:1px solid #333;
color:#aaa;
padding:8px 14px;
border-radius:20px;
cursor:pointer;
}

.main-menu button.active{
color:#ffb52e;
border-color:#ffb52e;
}

.panel{
border:1px solid #222;
border-radius:12px;
padding:15px;
background:#111;
}

/* 홈 */
.home-grid{
display:grid;
grid-template-columns:0.8fr 1.2fr;
gap:15px;
}

.card{
background:#111;
border:1px solid #222;
border-radius:12px;
padding:15px;
}

.card-title{
color:#ffb52e;
font-weight:bold;
margin-bottom:10px;
}

.notice-item{
padding:10px 0;
border-bottom:1px solid #222;
}

.tube-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.tube-card{
border:1px solid #222;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:.2s;
background:#111;
}

.tube-card:hover{
border-color:#ffb52e;
transform:translateY(-3px);
}

.thumb{
width:100%;
aspect-ratio:16/9;
background:#000;
}

.thumb img{
width:100%;
height:100%;
object-fit:cover;
}

.tube-body{
padding:10px;
}

.title{
font-weight:bold;
font-size:14px;
}

.sub{
font-size:12px;
color:#888;
}

/* 영상 팝업 */
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.modal.active{
display:flex;
}

.modal-box{
width:min(900px,100%);
background:#000;
border-radius:10px;
overflow:hidden;
}

.modal iframe{
width:100%;
height:500px;
border:none;
}

/* 정보 */
.info-menu{
display:flex;
gap:8px;
margin-bottom:10px;
flex-wrap:wrap;
}

.info-menu button{
background:#222;
border:1px solid #444;
color:#aaa;
padding:6px 12px;
border-radius:20px;
cursor:pointer;
}

.info-menu button.active{
color:#ffb52e;
border-color:#ffb52e;
}

@media(max-width:800px){
.home-grid{grid-template-columns:1fr}
.tube-grid{grid-template-columns:1fr}
.modal iframe{height:300px}
}
</style>
</head>

<body>

<div class="wrap">

<div class="main-menu">
<button onclick="showHome()" class="active">메인</button>
<button onclick="showNotice()">공지사항</button>
<button onclick="showTube()">AXE TUBE</button>
<button onclick="showInfo()">정보</button>
</div>

<div class="panel" id="content"></div>

</div>

<div class="modal" id="modal" onclick="closeVideo(event)">
<div class="modal-box" id="modalBox"></div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbwQIA-5BvzwBYCR3zIYHAZSG5eublKx2wNJlGe-qGuqyHAdjTUvQ1WBU-YzoOdXzIKB/exec";

let notices=[],tubes=[],crafts=[],materials=[];

fetch(API)
.then(r=>r.json())
.then(d=>{
notices=d.notices||[];
tubes=d.tubes||[];
crafts=d.crafts||[];
materials=d.materials||[];
showHome();
});

function setActive(i){
document.querySelectorAll(".main-menu button").forEach((b,idx)=>{
b.classList.toggle("active",idx===i);
});
}

function getId(url){
const m=url.match(/(?:v=|youtu\.be\/)([^&]+)/);
return m?m[1]:"";
}

function getThumb(t){
if(t.thumbnail) return t.thumbnail;
const id=getId(t.url);
return id?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:"";
}

function openVideo(url){
const id=getId(url);
if(!id) return alert("영상 오류");

document.getElementById("modal").classList.add("active");
document.getElementById("modalBox").innerHTML=
`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allowfullscreen></iframe>`;
}

function closeVideo(e){
if(e.target.id==="modal"){
document.getElementById("modal").classList.remove("active");
document.getElementById("modalBox").innerHTML="";
}
}

/* 메인 */
function showHome(){
setActive(0);

document.getElementById("content").innerHTML=`
<div class="home-grid">

<div class="card">
<div class="card-title">공지사항</div>
${notices.slice(-4).reverse().map(n=>`
<div class="notice-item">
<div class="title">${n.title}</div>
<div class="sub">${n.date}</div>
</div>`).join("")}
</div>

<div class="card">
<div class="card-title">AXE TUBE</div>
<div class="tube-grid">
${tubes.slice(-6).reverse().map(t=>`
<div class="tube-card" onclick="openVideo('${t.url}')">
<div class="thumb"><img src="${getThumb(t)}"></div>
<div class="tube-body">
<div class="title">${t.title}</div>
<div class="sub">${t.date}</div>
</div>
</div>`).join("")}
</div>
</div>

</div>
`;
}

/* 공지 */
function showNotice(){
setActive(1);

document.getElementById("content").innerHTML=`
<div class="card">
<div class="card-title">공지사항</div>
${notices.reverse().map(n=>`
<div class="notice-item">
<div class="title">${n.title}</div>
<div class="sub">${n.date}</div>
</div>`).join("")}
</div>
`;
}

/* 튜브 */
function showTube(){
setActive(2);

document.getElementById("content").innerHTML=`
<div class="tube-grid">
${tubes.reverse().map(t=>`
<div class="tube-card" onclick="openVideo('${t.url}')">
<div class="thumb"><img src="${getThumb(t)}"></div>
<div class="tube-body">
<div class="title">${t.title}</div>
<div class="sub">${t.date}</div>
</div>
</div>`).join("")}
</div>
`;
}

/* 정보 */
function showInfo(){
setActive(3);

document.getElementById("content").innerHTML=`
<div class="info-menu">
<button class="active">제작</button>
<button>아이템 시세</button>
<button>스킬</button>
<button>생활</button>
<button>무법지대</button>
<button>상자</button>
</div>

<div class="card">제작 데이터 연결됨</div>
`;
}
</script>

</body>
</html>
