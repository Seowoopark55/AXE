<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXE 정보센터</title>

<style>
body {
    margin: 0;
    background: #0b0b0b;
    color: #fff;
    font-family: Arial;
}

.wrap {
    max-width: 1300px;
    margin: auto;
    padding: 20px;
}

/* 상단 */
.top {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
}

.logo {
    width: 60px;
}

h1 {
    margin: 0;
    font-size: 22px;
}

/* 검색 */
.search {
    flex: 1;
}

.search input {
    width: 100%;
    height: 42px;
    border-radius: 10px;
    border: none;
    padding: 0 15px;
    background: #1a1a1a;
    color: #fff;
}

/* 카테고리 */
.filter {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.filter button {
    background: #1a1a1a;
    border: 1px solid #333;
    color: #aaa;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
}

.filter button.active {
    color: #ffb52e;
    border-color: #ffb52e;
}

/* 메인 */
.main {
    display: flex;
    gap: 20px;
}

/* 좌측 리스트 */
.list {
    width: 35%;
    max-height: 600px;
    overflow-y: auto;
    border: 1px solid #222;
    border-radius: 10px;
}

.item {
    padding: 12px;
    border-bottom: 1px solid #222;
    cursor: pointer;
}

.item:hover {
    background: #151515;
}

.item.active {
    background: #222;
}

.item-name {
    font-weight: bold;
}

.item-sub {
    font-size: 12px;
    color: #888;
}

/* 우측 상세 */
.detail {
    flex: 1;
    border: 1px solid #222;
    border-radius: 10px;
    padding: 20px;
}

.detail h2 {
    margin-top: 0;
}

.meta {
    margin: 10px 0;
    color: #ccc;
}

.material {
    margin-top: 15px;
}

.material div {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #222;
    padding: 5px 0;
}

/* 반응형 */
@media(max-width:900px){
    .main {
        flex-direction: column;
    }
    .list {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="wrap">

    <div class="top">
        <img src="./axe.png" class="logo">
        <h1>AXE 제작 정보</h1>
        <div class="search">
            <input type="text" id="search" placeholder="아이템 / 재료 검색">
        </div>
    </div>

    <div class="filter" id="filter"></div>

    <div class="main">
        <div class="list" id="list"></div>
        <div class="detail" id="detail">아이템을 선택하세요</div>
    </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyGjviirSK0lP3KMP50JkQBZip2eWS6JpGDVWWXDKeljoYhpzuohnKLllpTmja0sYikkw/exec";

const map = {
    ALL: "전체",
    SMG: "SMG",
    PISTOL: "피스톨",
    REVOLVER: "리볼버",
    KNIFE: "나이프",
    ETC: "기타"
};

let crafts = [];
let materials = [];
let current = "ALL";
let selected = null;

fetch(API)
.then(r=>r.json())
.then(d=>{
    crafts = d.crafts;
    materials = d.materials;
    init();
});

function init(){
    makeFilter();
    renderList();
}

function makeFilter(){
    const el = document.getElementById("filter");
    const cats = ["ALL", ...new Set(crafts.map(c=>c.category))];

    el.innerHTML = cats.map(c=>
        `<button onclick="setCat('${c}')" class="${c===current?'active':''}">
        ${map[c]||c}</button>`
    ).join("");
}

function setCat(c){
    current = c;
    makeFilter();
    renderList();
}

document.getElementById("search").oninput = renderList;

function renderList(){
    const kw = document.getElementById("search").value.toLowerCase();

    let list = kw
        ? crafts
        : (current==="ALL"?crafts:crafts.filter(c=>c.category===current));

    if(kw){
        list = list.filter(c=>{
            const mats = materials.filter(m=>m.craft_id===c.id);
            return (
                c.item_name.toLowerCase().includes(kw) ||
                mats.some(m=>m.material_name.toLowerCase().includes(kw))
            );
        });
    }

    const el = document.getElementById("list");

    el.innerHTML = list.map(c=>
        `<div class="item ${selected===c.id?'active':''}" onclick="selectItem('${c.id}')">
            <div class="item-name">${c.item_name}</div>
            <div class="item-sub">${map[c.category]} / ${c.craft_rank}</div>
        </div>`
    ).join("");
}

function selectItem(id){
    selected = id;
    renderList();

    const c = crafts.find(x=>x.id===id);
    const mats = materials.filter(m=>m.craft_id===id);

    document.getElementById("detail").innerHTML = `
        <h2>${c.item_name}</h2>
        <div class="meta">분류: ${map[c.category]}</div>
        <div class="meta">성공률: ${c.success_rate}%</div>
        <div class="meta">랭크: ${c.craft_rank}</div>
        <div class="meta">획득처: ${c.obtain_place}</div>

        <div class="material">
            <h3>재료</h3>
            ${mats.map(m=>`
                <div>
                    <span>${m.material_name}</span>
                    <span>x${m.quantity}</span>
                </div>
            `).join("")}
        </div>
    `;
}
</script>

</body>
</html>
