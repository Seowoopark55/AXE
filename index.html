function onMapSearch(value){
    mapSearchKeyword=value.trim();
    selectedMapId="";
    renderMapList();
    renderEmptyMapDetail();
}

function getFilteredMaps(){
    const keyword=mapSearchKeyword.toLowerCase();
    if(!keyword)return briefingMaps;
    return briefingMaps.filter(m=>[m.id,m.map_name,m.description,m.note,m.updated_at,m.coord].join(" ").toLowerCase().includes(keyword));
}

function renderMapList(){
    const mapListBox=document.getElementById("mapListBox");
    const mapResultInfo=document.getElementById("mapResultInfo");
    if(!mapListBox)return;

    const list=getFilteredMaps();

    if(mapResultInfo)mapResultInfo.textContent=`브리핑맵 검색 결과 ${list.length}개`;

    if(list.length===0){
        mapListBox.innerHTML=`<div class="ready">검색 결과가 없습니다.</div>`;
        renderEmptyMapDetail();
        return;
    }

    mapListBox.innerHTML=list.map(m=>`
        <div class="item-row ${selectedMapId===m.id?"active":""}" onclick="selectBriefingMap('${escapeText(m.id)}')">
            <div class="item-name">${safe(m.map_name)}</div>
            <div class="item-sub">좌표: ${safe(m.coord)}</div>
        </div>
    `).join("");
}

function renderEmptyMapDetail(){
    const box=document.getElementById("mapDetailBox");
    if(!box)return;
    box.innerHTML=`<div class="empty-detail">좌측 목록에서 브리핑맵을 선택하세요.</div>`;
}

function getMapImagePath(map){
    if(map.image&&String(map.image).trim()!==""&&String(map.image).trim()!=="-")return String(map.image).trim();
    return `./${map.id}.png`;
}

function selectBriefingMap(id){
    selectedMapId=id;
    const map=briefingMaps.find(m=>String(m.id)===String(id));
    if(!map)return;

    renderMapList();

    const img=getMapImagePath(map);

    document.getElementById("mapDetailBox").innerHTML=`
        <div class="detail-title">${safe(map.map_name)}</div>
        <div class="badges">
            <span class="badge gold">브리핑맵</span>
            <span class="badge">좌표 ${safe(map.coord)}</span>
            <span class="badge">수정일 ${formatDate(map.updated_at)}</span>
        </div>
        <img class="map-image" src="${img}" onerror="this.src='./axe.png'" onclick="openImageModal('${img}')">
        <div class="info-grid">
            <div class="info-card"><div class="info-label">지역명</div><div class="info-value">${safe(map.map_name)}</div></div>
            <div class="info-card"><div class="info-label">좌표</div><div class="info-value">${safe(map.coord)}</div></div>
            <div class="info-card"><div class="info-label">수정일</div><div class="info-value">${formatDate(map.updated_at)}</div></div>
        </div>
        <div class="home-card">
            <div class="home-card-title">설명</div>
            <div class="item-content">${safe(map.description)}</div>
            <div class="item-content">${safe(map.note)}</div>
        </div>`;
    scrollToElement("mapDetailBox");
}

function showOutlawGuides(){
    setOutlawTab("guide");
    selectedGuideId="";
    const groups=getOutlawGuideGroups();

    if(groups.length===0){
        document.getElementById("outlawContent").innerHTML=`<div class="ready">등록된 무법지대 공략이 없습니다.</div>`;
        return;
    }

    selectedGuideId=groups[0].id;

    document.getElementById("outlawContent").innerHTML=`
        <div class="db-layout outlaw-layout">
            <div class="item-list"><div class="list-scroll" id="guideListBox"></div></div>
            <div class="detail map-detail" id="guideDetailBox"><div class="empty-detail">좌측 목록에서 공략을 선택하세요.</div></div>
        </div>`;

    renderOutlawGuideList();
    selectOutlawGuide(selectedGuideId);
}

function getOutlawGuideGroups(){
    const map={};

    outlawGuides.forEach((row,index)=>{
        const id=String(row.id||row.map_id||row.map_name||row.title||`guide_${index}`).trim();
        if(!id||id==="-")return;

        if(!map[id]){
            map[id]={
                id:id,
                map_name:row.map_name||row.title||id,
                coord:row.coord||row.coordinate||"",
                main_image:row.main_image||row.route_image||row.map_image||"",
                updated_at:row.updated_at||row.date||"",
                rows:[]
            };
        }

        if(!map[id].main_image&&(row.main_image||row.route_image||row.map_image)){
            map[id].main_image=row.main_image||row.route_image||row.map_image;
        }
        if(!map[id].coord&&(row.coord||row.coordinate)){
            map[id].coord=row.coord||row.coordinate;
        }
        if(!map[id].updated_at&&(row.updated_at||row.date)){
            map[id].updated_at=row.updated_at||row.date;
        }

        map[id].rows.push(row);
    });

    return Object.values(map).sort((a,b)=>{
        const ao=Math.min(...a.rows.map(r=>Number(r.order||999999)));
        const bo=Math.min(...b.rows.map(r=>Number(r.order||999999)));
        return ao-bo;
    });
}

function renderOutlawGuideList(){
    const box=document.getElementById("guideListBox");
    if(!box)return;

    const groups=getOutlawGuideGroups();
    box.innerHTML=groups.map(g=>`
        <div class="item-row ${selectedGuideId===g.id?"active":""}" onclick="selectOutlawGuide('${escapeText(g.id)}')">
            <div class="item-name">${safe(g.map_name)}</div>
            <div class="item-sub">좌표: ${safe(g.coord)}</div>
        </div>
    `).join("");
}

function getGuideImagePath(v){
    const image=String(v||"").trim();
    if(!image||image==="-")return "";
    return image;
}

function selectOutlawGuide(id){
    selectedGuideId=id;
    renderOutlawGuideList();

    const guide=getOutlawGuideGroups().find(g=>String(g.id)===String(id));
    if(!guide)return;

    const rows=guide.rows.slice().sort((a,b)=>Number(a.order||0)-Number(b.order||0));
    const mainImage=getGuideImagePath(guide.main_image);

    const routeGroups=[];
    const routeMap={};

    rows.forEach((r,index)=>{
        const group=String(r.route_group||r.group||r.section||"공략").trim()||"공략";
        if(!routeMap[group]){
            routeMap[group]=[];
            routeGroups.push(group);
        }
        routeMap[group].push({...r,_index:index});
    });

    const routesHtml=routeGroups.map(group=>`
        <div class="guide-route-title">${safe(group)}</div>
        ${routeMap[group].map(step=>{
            const img=getGuideImagePath(step.image||step.step_image||"");
            const video=String(step.video_url||step.video||step.youtube_url||"").trim();
            return `
                <div class="guide-step">
                    <div class="guide-step-head">
                        <span class="guide-step-no">${safe(step.step_no||step.step||"")}</span>
                        <div class="guide-step-title">${safe(step.title)}</div>
                    </div>
                    <div class="guide-step-content">${safe(step.content||step.description||step.note)}</div>
                    ${img?`<img class="guide-step-image" src="${img}" onerror="this.style.display='none'" onclick="openImageModal('${img}')">`:""}
                    ${video?renderGuideVideoThumb(video,step.title||guide.map_name):""}
                </div>
            `;
        }).join("")}
    `).join("");

    document.getElementById("guideDetailBox").innerHTML=`
        <div class="detail-title">${safe(guide.map_name)}</div>
        <div class="badges">
            <span class="badge gold">무법지대 공략</span>
            <span class="badge">좌표 ${safe(guide.coord)}</span>
            ${guide.updated_at?`<span class="badge">수정일 ${formatDate(guide.updated_at)}</span>`:""}
        </div>
        ${mainImage?`<img class="guide-main-image" src="${mainImage}" onerror="this.style.display='none'" onclick="openImageModal('${mainImage}')">`:""}
        ${routesHtml}
    `;
    scrollToElement("guideDetailBox");
}
