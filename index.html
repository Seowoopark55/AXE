<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXE NET</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,rgba(255,181,46,.14),transparent 34%),linear-gradient(180deg,#050505 0%,#111 45%,#070707 100%);color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:1280px;margin:auto;padding:28px 18px 50px}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:22px;min-height:170px;padding:28px 32px;margin-bottom:18px;border-radius:24px;border:1px solid rgba(255,181,46,.22);background:linear-gradient(135deg,rgba(255,181,46,.13),rgba(255,255,255,.025)),#101010;cursor:pointer}
.hero:after{content:"AXE";position:absolute;right:34px;top:50%;transform:translateY(-50%);font-size:106px;font-weight:950;color:rgba(255,255,255,.035);letter-spacing:9px;pointer-events:none}
.logo-box{position:relative;z-index:2;width:120px;height:120px;border-radius:22px;background:rgba(0,0,0,.35);border:1px solid rgba(255,181,46,.22);display:flex;align-items:center;justify-content:center;padding:12px}
.logo-box img{max-width:100%;max-height:100%;object-fit:contain}
.hero-text{position:relative;z-index:2}
.kicker{color:#ffb52e;font-size:13px;font-weight:900;letter-spacing:1.4px;margin-bottom:8px}
h1{margin:0;font-size:42px;font-weight:950}
.sub{margin-top:10px;color:#c4c4c4;font-size:15px}

.main-menu{display:grid;grid-template-columns:repeat(8,1fr);border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(5,5,5,.88);overflow:hidden;margin-bottom:18px}
.main-menu button{height:46px;background:transparent;color:#cfcfcf;border:0;border-right:1px solid rgba(255,255,255,.06);cursor:pointer;font-size:14px;font-weight:950}
.main-menu button:last-child{border-right:0}
.main-menu button:hover,.main-menu button.active{color:#ffb52e;background:rgba(255,181,46,.09)}

.panel{border:1px solid rgba(255,255,255,.08);background:rgba(12,12,12,.88);border-radius:22px;padding:22px;min-height:480px}
.section-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}
.section-title{font-size:25px;font-weight:950}
.section-desc{color:#909090;font-size:13px;margin-top:5px}
.count{color:#ffb52e;background:rgba(255,181,46,.09);border:1px solid rgba(255,181,46,.25);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:850;white-space:nowrap}
.ready{padding:28px;color:#999;border:1px dashed rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.03)}
.actions{display:flex;justify-content:flex-end;margin-bottom:14px}
.btn,.back-btn,.submit-open{height:40px;padding:0 15px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:rgba(20,20,20,.92);color:#bbb;font-weight:950;cursor:pointer}
.btn:hover,.back-btn:hover,.submit-open:hover{color:#ffb52e;border-color:rgba(255,181,46,.45)}
.btn.danger:hover{color:#ff6b6b;border-color:rgba(255,107,107,.55)}
.primary{border:0;background:#ffb52e;color:#111}

.home-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px}
.home-card{border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.25);border-radius:18px;padding:16px}
.home-card-title{font-size:18px;font-weight:950;margin-bottom:12px;color:#ffb52e}
.home-list-item{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
.home-list-item:last-child{border-bottom:0}
.item-title{font-size:15px;font-weight:950}
.item-meta{margin-top:5px;font-size:12px;color:#888}
.item-content{margin-top:6px;font-size:13px;color:#aaa;line-height:1.5}

.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);border-radius:15px;overflow:hidden;cursor:pointer;transition:.18s ease}
.card:hover{border-color:rgba(255,181,46,.45);background:rgba(255,181,46,.055);transform:translateY(-2px)}
.thumb{width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.thumb.square{aspect-ratio:4/3}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:13px}
.card-title{font-size:15px;font-weight:950;color:#fff;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;color:#888;font-size:12px}
.badge{display:inline-flex;align-items:center;min-height:23px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#bbb;font-size:12px;font-weight:900}
.badge.gold{color:#ffb52e;background:rgba(255,181,46,.09);border-color:rgba(255,181,46,.28)}
.badge.like{color:#ffcf75;background:rgba(255,181,46,.1);border-color:rgba(255,181,46,.32)}
.badge.comment{color:#c8adff;background:rgba(156,95,255,.16);border-color:rgba(156,95,255,.48)}

.table-head,.table-row{display:grid;grid-template-columns:1fr 120px 90px 80px 80px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.table-head{color:#888;font-size:12px;font-weight:950;background:rgba(255,255,255,.025)}
.table-row{cursor:pointer}
.table-row:hover{background:rgba(255,181,46,.06)}
.table-title{font-size:15px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.table-cell{font-size:12px;color:#888}

.detail-card{border:1px solid rgba(255,255,255,.08);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),rgba(0,0,0,.24);padding:22px}
.detail-title{font-size:28px;font-weight:950;color:#fff;line-height:1.25;margin-bottom:10px}
.detail-meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.detail-content{white-space:pre-line;line-height:1.72;font-size:15px;color:#ddd;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:18px}
.detail-video{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.1);margin:14px 0 16px}
.detail-video iframe{width:100%;height:100%;border:0}
.detail-images{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 16px}
.detail-images img,.map-img{width:100%;max-height:420px;object-fit:contain;background:#000;border:1px solid rgba(255,255,255,.1);border-radius:13px;cursor:zoom-in}
.reaction-area{display:flex;justify-content:center;gap:10px;margin:24px 0 18px}
.reaction-btn{height:42px;min-width:86px;padding:0 17px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);color:#d6d6d6;font-size:14px;font-weight:950;cursor:pointer}
.reaction-btn.active.like{border-color:rgba(255,181,46,.68);background:rgba(255,181,46,.14);color:#ffcf75}
.reaction-btn.active.dislike{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.13);color:#e0e0e0}
.bottom-actions{display:flex;justify-content:space-between;gap:12px;margin:12px 0 8px}
.admin-actions{display:flex;gap:8px}

.comment-section{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
.comment-title{font-size:18px;font-weight:950;color:#ffb52e;margin-bottom:12px}
.comment-list{display:grid;gap:9px;margin-bottom:14px}
.comment-item{border:1px solid rgba(255,255,255,.075);background:rgba(0,0,0,.22);border-radius:13px;padding:12px 13px}
.comment-item.reply{margin-left:28px;background:rgba(156,95,255,.045);border-left:3px solid rgba(156,95,255,.42)}
.comment-meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px;color:#888;font-size:12px}
.comment-writer{color:#ffb52e;font-weight:950}
.comment-content{white-space:pre-line;line-height:1.55;color:#ddd;font-size:14px}
.comment-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.comment-btn{height:28px;padding:0 9px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);color:#aaa;cursor:pointer;font-size:12px;font-weight:900}
.comment-btn.active.like{color:#ffcf75;background:rgba(255,181,46,.13);border-color:rgba(255,181,46,.48)}
.comment-btn.active.dislike{color:#e0e0e0;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26)}
.comment-form,.reply-form{display:grid;grid-template-columns:140px 150px 1fr 96px;gap:8px;align-items:stretch}
.reply-form{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
.reply-form.active{display:grid}
.input,.textarea{border:1px solid rgba(255,255,255,.1);background:#151515;color:#fff;border-radius:12px;padding:11px;outline:none;font-family:Arial,sans-serif}
.textarea{min-height:44px;resize:vertical}
.submit{border:0;border-radius:12px;background:#ffb52e;color:#111;font-weight:950;cursor:pointer}

.form-modal,.image-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:14px;z-index:9999}
.form-modal.active,.image-modal.active{display:flex}
.form-box{width:min(560px,100%);background:#0d0d0d;border:1px solid rgba(255,181,46,.25);border-radius:18px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.55)}
.form-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.form-title{font-weight:950;color:#ffb52e}
.form-close{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:18px}
.form-body{padding:16px}
.form-label{font-size:12px;color:#aaa;margin:10px 0 6px;font-weight:850}
.form-input,.form-textarea{width:100%;border:1px solid rgba(255,255,255,.1);background:#151515;color:#fff;border-radius:12px;padding:12px;outline:none;font-family:Arial,sans-serif}
.form-textarea{min-height:110px;resize:vertical}
.form-submit{width:100%;height:44px;margin-top:14px;border:0;border-radius:12px;background:#ffb52e;color:#111;font-weight:950;cursor:pointer}
.form-help{font-size:12px;color:#888;line-height:1.5;margin-top:10px}

.image-modal{padding:18px;overflow:auto}
.image-modal-box{position:relative;display:inline-block;max-width:95vw;max-height:90vh}
.image-modal-box img{width:auto;height:auto;max-width:95vw;max-height:90vh;object-fit:contain;border-radius:10px;border:1px solid rgba(255,181,46,.35);background:#000;display:block}
.image-close{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.72);color:#fff;font-size:24px;font-weight:900;cursor:pointer}

.sub-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.sub-filter button{height:40px;padding:0 15px;border-radius:13px;border:1px solid rgba(255,255,255,.09);background:#111;color:#aaa;font-weight:950;cursor:pointer}
.sub-filter button.active,.sub-filter button:hover{color:#111;background:#ffb52e}
.info-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.info-card{border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.24);border-radius:15px;padding:15px}
.info-card h3{margin:0 0 8px;color:#ffb52e}
.info-card pre{white-space:pre-wrap;color:#ddd;font-family:Arial,sans-serif;line-height:1.55;margin:0}

@media(max-width:980px){
.main-menu{grid-template-columns:repeat(4,1fr)}
.card-grid{grid-template-columns:repeat(2,1fr)}
.home-grid{grid-template-columns:1fr}
.info-list{grid-template-columns:1fr}
}
@media(max-width:760px){
.wrap{padding:16px 10px 34px}
.hero{min-height:110px;padding:16px 14px;gap:12px}
.hero:after{font-size:52px;right:12px}
.logo-box{width:74px;height:74px;min-width:74px;border-radius:16px}
h1{font-size:27px}
.sub{font-size:12px}
.panel{padding:14px;border-radius:18px}
.section-head{display:block}
.section-title{font-size:21px}
.count{display:inline-block;margin-top:9px}
.card-grid{grid-template-columns:1fr}
.table-head{display:none}
.table-row{grid-template-columns:1fr;gap:5px}
.detail-card{padding:14px}
.detail-title{font-size:22px}
.detail-images{grid-template-columns:1fr}
.bottom-actions{display:grid;grid-template-columns:1fr}
.admin-actions{display:grid;grid-template-columns:1fr 1fr}
.comment-form,.reply-form.active{grid-template-columns:1fr}
.submit{height:42px}
.comment-meta{display:block}
.comment-actions{margin-top:8px}
.comment-item.reply{margin-left:8px}
}
@media(max-width:420px){
.main-menu button{font-size:12px;padding:0 3px}
}
</style>
</head>

<body>
<div class="wrap">
    <div class="hero" onclick="navigateMain('home')">
        <div class="logo-box"><img src="./axe.png" alt="AXE 로고" onerror="this.style.display='none'"></div>
        <div class="hero-text">
            <div class="kicker">AXE COMPANY NETWORK</div>
            <h1>AXE NET</h1>
            <div class="sub">AXE 내부 운영 시스템</div>
        </div>
    </div>

    <div class="main-menu">
        <button class="active" onclick="navigateMain('home')">메인</button>
        <button onclick="navigateMain('notice')">공지사항</button>
        <button onclick="navigateMain('tube')">AXE TUBE</button>
        <button onclick="navigateMain('outlaw')">무법지대</button>
        <button onclick="navigateMain('board')">자유게시판</button>
        <button onclick="navigateMain('gallery')">갤러리</button>
        <button onclick="navigateMain('info')">정보</button>
        <button onclick="navigateMain('utility')">편의기능</button>
    </div>

    <div class="panel" id="content"></div>
</div>

<div class="image-modal" id="imageModal" onclick="closeImageModal()">
    <div class="image-modal-box" onclick="event.stopPropagation();">
        <button class="image-close" onclick="closeImageModal()">×</button>
        <img id="imageModalImg" src="">
    </div>
</div>

<div class="form-modal" id="tubeFormModal" onclick="closeModalOutside(event,'tubeFormModal')">
    <div class="form-box">
        <div class="form-head"><div class="form-title">AXE TUBE 글쓰기</div><button class="form-close" onclick="closeTubeForm()">×</button></div>
        <div class="form-body">
            <div class="form-label">작성자</div><input class="form-input" id="tubeWriter">
            <div class="form-label">영상 제목</div><input class="form-input" id="tubeTitle">
            <div class="form-label">유튜브 링크</div><input class="form-input" id="tubeUrl" placeholder="https://youtube.com/...">
            <div class="form-label">썸네일 주소 선택</div><input class="form-input" id="tubeThumbnail" placeholder="비워두면 유튜브 썸네일 자동 사용">
            <div class="form-label">분류</div><input class="form-input" id="tubeCategory" value="일반">
            <div class="form-label">내용</div><textarea class="form-textarea" id="tubeContent"></textarea>
            <div class="form-label">삭제 비밀번호</div><input class="form-input" id="tubePassword" type="password">
            <button class="form-submit" onclick="submitTubePost()">등록하기</button>
        </div>
    </div>
</div>

<div class="form-modal" id="boardFormModal" onclick="closeModalOutside(event,'boardFormModal')">
    <div class="form-box">
        <div class="form-head"><div class="form-title">자유게시판 글쓰기</div><button class="form-close" onclick="closeBoardForm()">×</button></div>
        <div class="form-body">
            <div class="form-label">작성자</div><input class="form-input" id="boardWriter">
            <div class="form-label">제목</div><input class="form-input" id="boardTitle">
            <div class="form-label">분류</div><input class="form-input" id="boardCategory" value="일반">
            <div class="form-label">내용</div><textarea class="form-textarea" id="boardContent"></textarea>
            <div class="form-label">삭제 비밀번호</div><input class="form-input" id="boardPassword" type="password">
            <button class="form-submit" onclick="submitBoardPost()">등록하기</button>
        </div>
    </div>
</div>

<div class="form-modal" id="galleryFormModal" onclick="closeModalOutside(event,'galleryFormModal')">
    <div class="form-box">
        <div class="form-head"><div class="form-title">갤러리 글쓰기</div><button class="form-close" onclick="closeGalleryForm()">×</button></div>
        <div class="form-body">
            <div class="form-label">작성자</div><input class="form-input" id="galleryWriter">
            <div class="form-label">제목</div><input class="form-input" id="galleryTitle">
            <div class="form-label">분류</div><input class="form-input" id="galleryCategory" value="일반">
            <div class="form-label">사진 업로드 최대 5장</div><input class="form-input" id="galleryImages" type="file" accept="image/*" multiple>
            <div class="form-label">내용</div><textarea class="form-textarea" id="galleryContent"></textarea>
            <div class="form-label">삭제 비밀번호</div><input class="form-input" id="galleryPassword" type="password">
            <button class="form-submit" onclick="submitGalleryPost()">등록하기</button>
            <div class="form-help">사진은 Apps Script를 통해 구글 드라이브에 저장됩니다.</div>
        </div>
    </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwl_e_JbXpqxSNp_q9-vtJGdSQqL2Z2TiQ8GjO8Ulrve3Pqta--A6yTvE0KTB3pUU1jSA/exec";

let notices=[],operations=[],tubes=[],tubeComments=[],crafts=[],materials=[],craftRanks=[],briefingMaps=[],outlawGuides=[],quests=[],processes=[],materialRecipes=[],modBooks=[],skillRanks=[],boards=[],boardComments=[],galleries=[],galleryComments=[];
let currentPage="home";
const pageMap={home:0,notice:1,tube:2,outlaw:3,board:4,gallery:5,info:6,utility:7};

function init(){
    fetch(API_URL)
    .then(r=>r.json())
    .then(data=>{
        notices=data.notices||[];
        operations=data.operations||[];
        tubes=data.tubes||[];
        tubeComments=data.tubeComments||data.tube_comments||[];
        crafts=data.crafts||[];
        materials=data.materials||[];
        craftRanks=data.craftRanks||data.craft_ranks||[];
        briefingMaps=data.briefingMaps||[];
        outlawGuides=data.outlawGuides||[];
        quests=data.quests||[];
        processes=data.processes||[];
        materialRecipes=data.materialRecipes||[];
        modBooks=data.modBooks||[];
        skillRanks=data.skillRanks||[];
        boards=data.boards||[];
        boardComments=data.boardComments||data.board_comments||[];
        galleries=data.galleries||[];
        galleryComments=data.galleryComments||data.gallery_comments||[];
        showHome();
    })
    .catch(err=>{
        document.getElementById("content").innerHTML=`<div class="ready">데이터를 불러오지 못했습니다.<br>${escapeHtml(String(err))}</div>`;
    });
}

function navigateMain(page){
    currentPage=page;
    if(page==="home")showHome();
    if(page==="notice")showNotice();
    if(page==="tube")showTube();
    if(page==="outlaw")showOutlaw();
    if(page==="board")showBoard();
    if(page==="gallery")showGallery();
    if(page==="info")showInfo();
    if(page==="utility")showUtility();
}

function setActive(page){
    document.querySelectorAll(".main-menu button").forEach((b,i)=>b.classList.toggle("active",i===pageMap[page]));
}

function safe(v){return v===undefined||v===null||v===""?"-":escapeHtml(String(v))}
function raw(v){return v===undefined||v===null?"":String(v)}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function js(v){return String(v||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g,"\\n").replace(/\r/g,"")}
function formatDate(v){if(!v)return "-";const d=new Date(v);if(isNaN(d.getTime()))return safe(v);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`}
function sortByRecent(list){return list.slice().sort((a,b)=>(Number(a.order||0)||999999)-(Number(b.order||0)||999999)||((new Date(b.date||0))-new Date(a.date||0)))}
function getId(item,index,prefix){return String(item.id||item.comment_id||item.title||`${prefix}_${index}`)}
function postApi(payload){return fetch(API_URL,{method:"POST",body:JSON.stringify(payload)}).then(r=>r.json())}

function clientId(scope){
    const key=`axe_${scope}_client_id`;
    let id=localStorage.getItem(key);
    if(!id){id="client_"+Date.now()+"_"+Math.random().toString(36).slice(2);localStorage.setItem(key,id)}
    return id;
}

function localList(key){
    try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return[]}
}
function hasLocal(key,id){return localList(key).includes(String(id))}
function markLocal(key,id){const list=localList(key);if(!list.includes(String(id))){list.push(String(id));localStorage.setItem(key,JSON.stringify(list))}}
function unmarkLocal(key,id){localStorage.setItem(key,JSON.stringify(localList(key).filter(v=>String(v)!==String(id))))}

function section(title,desc,count){
    return `<div class="section-head"><div><div class="section-title">${title}</div><div class="section-desc">${desc}</div></div><div class="count">${count}</div></div>`;
}

function showNotice(){

function renderNoticeList(btn,type){
    if(btn){btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("active"));btn.classList.add("active")}
    const list=sortByRecent(type==="notice"?notices:operations);
    document.getElementById("noticeBox").innerHTML=list.length?`
        <div class="table-head"><div>제목</div><div>분류</div><div>작성일</div><div></div><div></div></div>
        ${list.map((n,i)=>`
        <div class="table-row" onclick="openNoticeDetail('${js(getId(n,i,type))}','${type}')">
            <div class="table-title">${safe(n.title)}</div>
            <div class="table-cell">${type==="notice"?"공지":"운영기준"}</div>
            <div class="table-cell">${formatDate(n.date)}</div>
            <div></div><div></div>
        </div>`).join("")}`:`<div class="ready">등록된 내용이 없습니다.</div>`;
}

function openNoticeDetail(id,type="notice"){
    const list=sortByRecent(type==="operation"?operations:notices);

    document.getElementById("content").innerHTML=`

function youtubeId(url){
    const s=String(url||"");
    const m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([^?&/]+)/);
    return m?m[1]:"";
}
function tubeThumb(t){
    if(t.thumbnail)return t.thumbnail;
    const id=youtubeId(t.url);
    return id?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:"./axe.png";
}
function findTube(id){return sortByRecent(tubes).find((t,i)=>getId(t,i,'tube')===String(id))}
function tubeCommentsFor(id){return tubeComments.filter(c=>String(c.tube_id)===String(id))}
function renderTubeCard(t,i){
    const id=getId(t,i,'tube');
    return `<div class="card" onclick="openTubeDetail('${js(id)}',true)">
        <div class="thumb"><img src="${escapeHtml(tubeThumb(t))}" onerror="this.src='./axe.png'"></div>
        <div class="card-body">
            <div class="card-title">${safe(t.title)}</div>
            <div class="card-meta">
                <span class="badge">${safe(t.writer||"AXE")}</span>
                <span class="badge">조회 ${Number(t.views||0)}</span>
                <span class="badge like">👍 ${Number(t.likes||0)}</span>
                <span class="badge comment">💬 ${tubeCommentsFor(id).length}</span>
            </div>
        </div>
    </div>`;
}

function reactionHtml(scope,id,item){
    const likeKey=`axe_${scope}_liked`;
    const dislikeKey=`axe_${scope}_disliked`;
    return `<div class="reaction-area">
        <button class="reaction-btn ${hasLocal(likeKey,id)?"active like":""}" onclick="toggleReaction('${scope}','${js(id)}','like')">👍 <span>${Number(item.likes||0)}</span></button>
        <button class="reaction-btn ${hasLocal(dislikeKey,id)?"active dislike":""}" onclick="toggleReaction('${scope}','${js(id)}','dislike')">👎 <span>${Number(item.dislikes||0)}</span></button>
    </div>`;
}
function findItem(scope,id){
    if(scope==="tube")return findTube(id);
    if(scope==="board")return findBoard(id);
    if(scope==="gallery")return findGallery(id);
}
function rerenderDetail(scope,id){
    if(scope==="tube")openTubeDetail(id,false);
    if(scope==="board")openBoardDetail(id,false);
    if(scope==="gallery")openGalleryDetail(id,false);
}
function toggleReaction(scope,id,kind){
    const likeKey=`axe_${scope}_liked`;
    const dislikeKey=`axe_${scope}_disliked`;
    const item=findItem(scope,id);
    const isLike=kind==="like";
    const active=hasLocal(isLike?likeKey:dislikeKey,id);
    const type=scope+"_"+(active?(isLike?"unlike":"undislike"):(isLike?"like":"dislike"));
    postApi({type,id,client_id:clientId(scope)})
    .then(data=>{
        if(data.result==="success"||data.result==="duplicate"||data.result==="not_found"){
            if(active){
                unmarkLocal(isLike?likeKey:dislikeKey,id);
                if(item)item[isLike?"likes":"dislikes"]=Math.max(0,Number(item[isLike?"likes":"dislikes"]||0)-1);
            }else{
                markLocal(isLike?likeKey:dislikeKey,id);
                unmarkLocal(isLike?dislikeKey:likeKey,id);
                if(item){
                    item[isLike?"likes":"dislikes"]=Number(item[isLike?"likes":"dislikes"]||0)+1;
                    item[isLike?"dislikes":"likes"]=Math.max(0,Number(item[isLike?"dislikes":"likes"]||0)-1);
                }
            }
            rerenderDetail(scope,id);
        }else alert(data.message||"처리 중 오류가 발생했습니다.");
    }).catch(()=>alert("처리 중 오류가 발생했습니다."));
}

function commentsHtml(scope,ownerId,comments){
    const roots=comments.filter(c=>!String(c.parent_comment_id||"").trim());
    return `<div class="comment-section">
        <div class="comment-title">댓글 ${comments.length}</div>
        <div class="comment-list">${roots.length?roots.map((c,i)=>commentItemHtml(scope,ownerId,c,i,comments,false)).join(""):`<div class="ready">등록된 댓글이 없습니다.</div>`}</div>
        <div class="comment-form">
            <input class="input" id="${scope}CommentWriter" placeholder="작성자">
            <input class="input" id="${scope}CommentPassword" type="password" placeholder="삭제 비밀번호">
            <textarea class="textarea" id="${scope}CommentContent" placeholder="댓글을 입력하세요"></textarea>
            <button class="submit" onclick="addComment('${scope}','${js(ownerId)}')">등록</button>
        </div>
    </div>`;
}
function commentId(c,i){return String(c.comment_id||c.id||i)}
function commentItemHtml(scope,ownerId,c,i,all,isReply){
    const id=commentId(c,i);
    const replies=all.filter(r=>String(r.parent_comment_id||"")===String(id));
    const likeKey=`axe_${scope}_comment_liked`;
    const dislikeKey=`axe_${scope}_comment_disliked`;
    const formId=`reply_${scope}_${id}`.replace(/[^a-zA-Z0-9_\-]/g,"_");
    return `<div class="comment-item ${isReply?"reply":""}">
        <div class="comment-meta">
            <div><span class="comment-writer">${safe(c.writer||"익명")}</span> · ${formatDate(c.date)}</div>
            <div class="comment-actions">
                <button class="comment-btn ${hasLocal(likeKey,id)?"active like":""}" onclick="toggleCommentReaction('${scope}','${js(ownerId)}','${js(id)}','like')">👍 ${Number(c.likes||0)}</button>
                <button class="comment-btn ${hasLocal(dislikeKey,id)?"active dislike":""}" onclick="toggleCommentReaction('${scope}','${js(ownerId)}','${js(id)}','dislike')">👎 ${Number(c.dislikes||0)}</button>
                ${!isReply?`<button class="comment-btn" onclick="toggleReply('${formId}')">답글</button>`:""}
                <button class="comment-btn" onclick="deleteCommentFront('${scope}','${js(ownerId)}','${js(id)}')">삭제</button>
            </div>
        </div>
        <div class="comment-content">${safe(c.content)}</div>
        ${!isReply?`<div class="reply-form" id="${formId}">
            <input class="input" id="${formId}_writer" placeholder="작성자">
            <input class="input" id="${formId}_password" type="password" placeholder="삭제 비밀번호">
            <textarea class="textarea" id="${formId}_content" placeholder="답글을 입력하세요"></textarea>
            <button class="submit" onclick="addComment('${scope}','${js(ownerId)}','${js(id)}','${formId}')">등록</button>
        </div>`:""}
        ${replies.map((r,ri)=>commentItemHtml(scope,ownerId,r,ri,all,true)).join("")}
    </div>`;
}
function toggleReply(id){const el=document.getElementById(id);if(el)el.classList.toggle("active")}
function ownerKey(scope){return scope==="board"?"post_id":scope==="tube"?"tube_id":"gallery_id"}
function addComment(scope,ownerId,parentId="",prefix=""){
    const writer=(prefix?document.getElementById(prefix+"_writer"):document.getElementById(scope+"CommentWriter")).value.trim()||"익명";
    const password=(prefix?document.getElementById(prefix+"_password"):document.getElementById(scope+"CommentPassword")).value.trim();
    const content=(prefix?document.getElementById(prefix+"_content"):document.getElementById(scope+"CommentContent")).value.trim();
    if(!content||!password){alert("댓글 내용과 삭제 비밀번호를 입력해주세요.");return}
    const payload={type:scope+"_comment_add",parent_comment_id:parentId,writer,content,password};
    payload[ownerKey(scope)]=ownerId;
    postApi(payload).then(data=>{
        if(data.result==="success"){
            const row={comment_id:data.comment_id,date:data.date||new Date().toISOString(),writer,content,parent_comment_id:parentId,likes:0,dislikes:0};
            row[ownerKey(scope)]=ownerId;
            if(scope==="board")boardComments.push(row);
            if(scope==="tube")tubeComments.push(row);
            if(scope==="gallery")galleryComments.push(row);
            rerenderDetail(scope,ownerId);
        }else alert(data.message||"댓글 등록 중 오류가 발생했습니다.");
    }).catch(()=>alert("댓글 등록 중 오류가 발생했습니다."));
}
function deleteCommentFront(scope,ownerId,commentId){
    const password=prompt("댓글 삭제 비밀번호를 입력하세요.");
    if(password===null)return;
    postApi({type:scope+"_comment_delete",comment_id:commentId,password}).then(data=>{
        if(data.result==="success"){
            const deleted=(data.deleted_comment_ids||[commentId]).map(String);
            if(scope==="board")boardComments=boardComments.filter(c=>!deleted.includes(String(c.comment_id)));
            if(scope==="tube")tubeComments=tubeComments.filter(c=>!deleted.includes(String(c.comment_id)));
            if(scope==="gallery")galleryComments=galleryComments.filter(c=>!deleted.includes(String(c.comment_id)));
            rerenderDetail(scope,ownerId);
        }else alert(data.message||"댓글 삭제 중 오류가 발생했습니다.");
    }).catch(()=>alert("댓글 삭제 중 오류가 발생했습니다."));
}
function findComment(scope,id){
    const list=scope==="board"?boardComments:scope==="tube"?tubeComments:galleryComments;
    return list.find(c=>String(c.comment_id)===String(id));
}
function toggleCommentReaction(scope,ownerId,commentId,kind){
    const likeKey=`axe_${scope}_comment_liked`;
    const dislikeKey=`axe_${scope}_comment_disliked`;
    const c=findComment(scope,commentId);
    const isLike=kind==="like";
    const active=hasLocal(isLike?likeKey:dislikeKey,commentId);
    const type=scope+"_comment_"+(active?(isLike?"unlike":"undislike"):(isLike?"like":"dislike"));
    postApi({type,comment_id:commentId,client_id:clientId(scope+"_comment")}).then(data=>{
        if(data.result==="success"||data.result==="duplicate"||data.result==="not_found"){
            if(active){
                unmarkLocal(isLike?likeKey:dislikeKey,commentId);
                if(c)c[isLike?"likes":"dislikes"]=Math.max(0,Number(c[isLike?"likes":"dislikes"]||0)-1);
            }else{
                markLocal(isLike?likeKey:dislikeKey,commentId);
                unmarkLocal(isLike?dislikeKey:likeKey,commentId);
                if(c){
                    c[isLike?"likes":"dislikes"]=Number(c[isLike?"likes":"dislikes"]||0)+1;
                    c[isLike?"dislikes":"likes"]=Math.max(0,Number(c[isLike?"dislikes":"likes"]||0)-1);
                }
            }
            rerenderDetail(scope,ownerId);
        }else alert(data.message||"처리 중 오류가 발생했습니다.");
    }).catch(()=>alert("처리 중 오류가 발생했습니다."));
}

function closeTubeForm(){document.getElementById("tubeFormModal").classList.remove("active")}
function submitTubePost(){
    const writer=document.getElementById("tubeWriter").value.trim();
    const title=document.getElementById("tubeTitle").value.trim();
    const url=document.getElementById("tubeUrl").value.trim();
    const thumbnail=document.getElementById("tubeThumbnail").value.trim();
    const category=document.getElementById("tubeCategory").value.trim()||"일반";
    const content=document.getElementById("tubeContent").value.trim();
    const password=document.getElementById("tubePassword").value.trim();
    if(!writer||!title||!url||!password){alert("작성자, 제목, 링크, 비밀번호는 필수입니다.");return}
    postApi({type:"tube_post",writer,title,url,thumbnail,category,content,password}).then(data=>{
        if(data.result==="success"){
            tubes.unshift({id:data.id,date:data.date,writer,title,url,thumbnail,category,content,views:0,likes:0,dislikes:0});
            closeTubeForm();showTube();
        }else alert(data.message||"등록 중 오류가 발생했습니다.");
    }).catch(()=>alert("등록 중 오류가 발생했습니다."));
}

function openGalleryForm(){document.getElementById("galleryFormModal").classList.add("active")}
function closeGalleryForm(){document.getElementById("galleryFormModal").classList.remove("active")}
function fileToDataUrl(file){
    return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(String(reader.result||""));
        reader.onerror=reject;
        reader.readAsDataURL(file);
    });
}
async function submitGalleryPost(){
    const writer=document.getElementById("galleryWriter").value.trim();
    const title=document.getElementById("galleryTitle").value.trim();
    const category=document.getElementById("galleryCategory").value.trim()||"일반";
    const content=document.getElementById("galleryContent").value.trim();
    const password=document.getElementById("galleryPassword").value.trim();
    const files=Array.from(document.getElementById("galleryImages").files||[]);
    if(!writer||!title||!password){alert("작성자, 제목, 비밀번호는 필수입니다.");return}
    if(!files.length){alert("사진을 선택해주세요.");return}
    if(files.length>5){alert("사진은 최대 5장까지 가능합니다.");return}
    const btn=document.querySelector("#galleryFormModal .form-submit");
    const old=btn.textContent;btn.disabled=true;btn.textContent="업로드 중...";
    try{
        const images=[];
        for(const file of files){
            images.push({image_base64:await fileToDataUrl(file),image_name:file.name,mime_type:file.type||"image/jpeg"});
        }
        const data=await postApi({type:"gallery_post",writer,title,category,content,password,images});
        if(data.result==="success"){
            galleries.unshift({id:data.id,date:data.date,writer,title,category,content,image_url:data.image_url,file_id:data.file_id,views:0,likes:0,dislikes:0});
            closeGalleryForm();showGallery();
        }else alert(data.message||"등록 중 오류가 발생했습니다.");
    }catch(e){
        alert("등록 중 오류가 발생했습니다. 사진 용량을 줄여 다시 시도해주세요.");
    }finally{
        btn.disabled=false;btn.textContent=old;
    }
}

function deletePostFront(scope,id){
    const password=prompt("삭제 비밀번호를 입력하세요.");
    if(password===null)return;
    postApi({type:scope+"_delete",id,password}).then(data=>{
        if(data.result==="success"){
            if(scope==="board"){boards=boards.filter((p,i)=>getId(p,i,'board')!==String(id));showBoard()}
            if(scope==="tube"){tubes=tubes.filter((p,i)=>getId(p,i,'tube')!==String(id));showTube()}
            if(scope==="gallery"){galleries=galleries.filter((p,i)=>getId(p,i,'gallery')!==String(id));showGallery()}
        }else alert(data.message||"삭제 중 오류가 발생했습니다.");
    }).catch(()=>alert("삭제 중 오류가 발생했습니다."));
}

function showOutlaw(){
    setActive("outlaw");
    const maps=briefingMaps||[];
    const guides=outlawGuides||[];
    document.getElementById("content").innerHTML=`
        ${section("무법지대","브리핑맵과 공략 정보를 확인합니다.",`${maps.length+guides.length}개`)}
        <div class="sub-filter">
            <button class="active" onclick="renderOutlaw(this,'map')">브리핑맵</button>
            <button onclick="renderOutlaw(this,'guide')">공략</button>
        </div>
        <div id="outlawBox"></div>`;
    renderOutlaw(null,"map");
}
function renderOutlaw(btn,type){
    if(btn){btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("active"));btn.classList.add("active")}
    const list=type==="map"?briefingMaps:outlawGuides;
    document.getElementById("outlawBox").innerHTML=list.length?`<div class="card-grid">${list.map((x,i)=>{
        const img=x.image||x.image_url||x.map_image||x.main_image||"";
        return `<div class="card" onclick="openOutlawDetail('${js(type)}',${i})">
            <div class="thumb square"><img src="${escapeHtml(img||'./axe.png')}" onerror="this.src='./axe.png'"></div>
            <div class="card-body"><div class="card-title">${safe(x.name||x.title)}</div><div class="card-meta"><span class="badge gold">${type==="map"?"브리핑맵":"공략"}</span></div></div>
        </div>`
    }).join("")}</div>`:`<div class="ready">등록된 내용이 없습니다.</div>`;
}
function openOutlawDetail(type,index){
    const item=(type==="map"?briefingMaps:outlawGuides)[index];
    const img=item.image||item.image_url||item.map_image||item.main_image||"";
    document.getElementById("content").innerHTML=`
        ${section(type==="map"?"브리핑맵":"무법지대 공략","상세 내용을 확인합니다.","DETAIL")}
        <div class="detail-card">
            <div class="detail-title">${safe(item.name||item.title)}</div>
            ${img?`<img class="map-img" src="${escapeHtml(img)}" onclick="openImageModal('${js(img)}')">`:""}
            <div class="detail-content">${safe(item.content||item.description||item.memo||"")}</div>
            <div class="bottom-actions"><button class="back-btn" onclick="showOutlaw()">목록으로</button></div>
        </div>`;
}

function showInfo(){
    setActive("info");
    document.getElementById("content").innerHTML=`
        ${section("정보","제작, 퀘스트, 가공재련, 개조서, 스킬랭크 정보를 확인합니다.","INFO")}
        <div class="sub-filter">
            <button class="active" onclick="renderInfo(this,'crafts')">제작</button>
            <button onclick="renderInfo(this,'quests')">퀘스트</button>
            <button onclick="renderInfo(this,'processes')">가공재련</button>
            <button onclick="renderInfo(this,'modBooks')">개조서</button>
            <button onclick="renderInfo(this,'skillRanks')">스킬랭크</button>
        </div>
        <div id="infoBox"></div>`;
    renderInfo(null,"crafts");
}
function renderInfo(btn,key){
    if(btn){btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("active"));btn.classList.add("active")}
    const data={crafts,quests,processes,modBooks,skillRanks}[key]||[];
    document.getElementById("infoBox").innerHTML=data.length?`<div class="info-list">${data.map(row=>{
        const title=row.name||row.title||row.item||row.item_name||row.품목||row.이름||"항목";
        const lines=Object.keys(row).filter(k=>row[k]!==""&&row[k]!==null&&row[k]!==undefined).map(k=>`${k}: ${row[k]}`).join("\n");
        return `<div class="info-card"><h3>${safe(title)}</h3><pre>${safe(lines)}</pre></div>`
    }).join("")}</div>`:`<div class="ready">등록된 정보가 없습니다.</div>`;
}

function showUtility(){
    setActive("utility");
    document.getElementById("content").innerHTML=`
        ${section("편의기능","간단 계산 기능입니다.","UTILITY")}
        <div class="info-card">
            <h3>플리카 계산기</h3>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
                <input class="input" id="plicaInput" type="number" placeholder="수량" oninput="calcPlica()">
                <button class="btn" onclick="document.getElementById('plicaInput').value=10;calcPlica()">10</button>
                <button class="btn" onclick="document.getElementById('plicaInput').value=50;calcPlica()">50</button>
                <button class="btn" onclick="document.getElementById('plicaInput').value=100;calcPlica()">100</button>
            </div>
            <div id="plicaResult" class="detail-content" style="margin-top:12px">수량을 입력하세요.</div>
        </div>`;
}
function calcPlica(){
    const n=Number(document.getElementById("plicaInput").value||0);
    document.getElementById("plicaResult").innerHTML=`입력 수량: ${n}<br>10배: ${n*10}<br>100배: ${n*100}`;
}

function openImageModal(src){
    document.getElementById("imageModalImg").src=src;
    document.getElementById("imageModal").classList.add("active");
}
function closeImageModal(){
    document.getElementById("imageModal").classList.remove("active");
    document.getElementById("imageModalImg").src="";
}
function closeModalOutside(event,id){if(event.target.id===id)document.getElementById(id).classList.remove("active")}

init();
</script>
