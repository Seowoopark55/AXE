<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXE 정보센터</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #080808;
    color: #fff;
    font-family: Arial, sans-serif;
}

.wrap {
    max-width: 1180px;
    margin: auto;
    padding: 30px 18px;
}

h1 {
    margin: 0 0 8px;
    font-size: 30px;
    font-weight: 800;
}

.sub {
    color: #999;
    margin-bottom: 26px;
    font-size: 14px;
}

.menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 28px;
}

.menu-card {
    background: linear-gradient(145deg, #151515, #101010);
    border: 1px solid #2b2b2b;
    border-radius: 16px;
    padding: 18px;
    cursor: pointer;
    transition: 0.15s ease;
}

.menu-card:hover {
    border-color: #444;
    transform: translateY(-2px);
}

.active-menu {
    border-color: #00e676;
}

.section-head {
    margin: 8px 0 16px;
}

.section-title {
    font-size: 24px;
    font-weight: 800;
}

.section-desc {
    color: #888;
    font-size: 13px;
    margin-top: 4px;
}

/* 검색창 */
.search-wrap {
    margin: 18px 0 16px;
}

.search-box {
    position: relative;
    width: 100%;
}

.search-box input {
    width: 100%;
    height: 52px;
    border-radius: 999px;
    border: 1px solid #333;
    background: linear-gradient(145deg, #151515, #101010);
    color: #fff;
    font-size: 16px;
    padding: 0 52px 0 48px;
    outline: none;
    transition: 0.15s ease;
}

.search-box input:focus {
    border-color: #00e676;
    box-shadow: 0 0 0 3px rgba(0, 230, 118, 0.08);
}

.search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #777;
    font-size: 18px;
}

.clear-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: #252525;
    color: #aaa;
    cursor: pointer;
    display: none;
}

.clear-btn:hover {
    background: #333;
    color: #fff;
}

.result-info {
    color: #888;
    font-size: 13px;
    margin: 0 0 14px;
}

.filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
}

.filter button {
    background: #171717;
    color: #ccc;
    border: 1px solid #333;
    border-radius: 999px;
    padding: 8px 13px;
    cursor: pointer;
    transition: 0.15s ease;
}

.filter button:hover {
    background: #242424;
}

.filter button.active {
    border-color: #00e676;
    color: #00e676;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    align-items: start;
}

.card {
    background: linear-gradient(145deg, #151515, #101010);
    border: 1px solid #2f2f2f;
    border-radius: 16px;
    padding: 18px;
    cursor: pointer;
    transition: 0.15s ease;
}

.card:hover {
    border-color: #4a4a4a;
    background: linear-gradient(145deg, #1b1b1b, #111);
    transform: translateY(-2px);
}

.item-name {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 12px;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
}

.badge {
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 999px;
    background: #222;
    border: 1px solid #3a3a3a;
    color: #ddd;
}

.badge.rate {
    color: #00e676;
    border-color: #00a85a;
}

.badge.rank {
    color: #ffd966;
    border-color: #8a6d00;
}

.meta {
    font-size: 13px;
    color: #aaa;
}

.materials {
    display: none;
    margin-top: 14px;
    padding: 14px;
    background: #0b0b0b;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
}

.material-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 10px;
}

.material-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid #1f1f1f;
    color: #ddd;
    font-size: 14px;
}

.material-row:last-child {
    border-bottom: none;
}

.qty {
    color: #00e676;
    font-weight: bold;
}

.empty {
    color: #888;
    padding: 22px;
    border: 1px dashed #333;
    border-radius: 14px;
    background: #111;
}

@media (max-width: 900px) {
    .menu, .grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 560px) {
    .wrap {
        padding: 24px 14px;
    }

    .menu, .grid {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 26px;
    }

    .search-box input {
        height: 50px;
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="wrap">
    <h1>AXE 정보센터</h1>
    <div class="sub">회사 운영 정보 · 제작 정보 · 게임 데이터 정리</div>

    <div class="menu">
        <div class="menu-card active-menu" onclick="showCraft()">제작 정보</div>
        <div class="menu-card" onclick="showReady(1)">아이템 시세</div>
        <div class="menu-card" onclick="showReady(2)">스킬</div>
        <div class="menu-card" onclick="showReady(3)">생활</div>
        <div class="menu-card" onclick="showReady(4)">무법지대</div>
        <div class="menu-card" onclick="showReady(5)">상자</div>
    </div>

    <div id="content"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyGjviirSK0lP3KMP50JkQBZip2eWS6JpGDVWWXDKeljoYhpzuohnKLllpTmja0sYikkw/exec";

let crafts = [];
let materials = [];
let currentCategory = "ALL";
let searchKeyword = "";

fetch(API_URL)
    .then(res => res.json())
    .then(data => {
        crafts = data.crafts || [];
        materials = data.materials || [];
        showCraft();
    })
    .catch(() => {
        document.getElementById("content").innerHTML = `
            <div class="empty">데이터를 불러오지 못했습니다.</div>
        `;
    });

function setActiveMenu(index) {
    document.querySelectorAll(".menu-card").forEach((el, i) => {
        el.classList.toggle("active-menu", i === index);
    });
}

function showCraft() {
    setActiveMenu(0);

    const categories = ["ALL", ...new Set(crafts.map(c => c.category).filter(Boolean))];

    let html = `
        <div class="section-head">
            <div class="section-title">제작 정보</div>
            <div class="section-desc">아이템을 검색하거나 카테고리를 선택하세요. 카드를 클릭하면 필요 재료가 펼쳐집니다.</div>
        </div>

        <div class="search-wrap">
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input
                    id="searchInput"
                    type="text"
                    placeholder="아이템명, 재료명, 분류 검색"
                    value="${searchKeyword}"
                    oninput="handleSearch(this.value)"
                >
                <button class="clear-btn" id="clearBtn" onclick="clearSearch()">×</button>
            </div>
        </div>

        <div class="filter">
    `;

    categories.forEach(cat => {
        html += `
            <button class="${cat === currentCategory ? "active" : ""}" onclick="filterCraft('${cat}')">
                ${cat}
            </button>
        `;
    });

    html += `
        </div>
        <div class="result-info" id="resultInfo"></div>
        <div class="grid" id="craftGrid"></div>
    `;

    document.getElementById("content").innerHTML = html;
    renderCrafts();
}

function filterCraft(cat) {
    currentCategory = cat;
    showCraft();
}

function handleSearch(value) {
    searchKeyword = value.trim();
    renderCrafts();

    const clearBtn = document.getElementById("clearBtn");
    if (clearBtn) {
        clearBtn.style.display = searchKeyword ? "block" : "none";
    }
}

function clearSearch() {
    searchKeyword = "";
    const input = document.getElementById("searchInput");
    if (input) input.value = "";
    renderCrafts();

    const clearBtn = document.getElementById("clearBtn");
    if (clearBtn) clearBtn.style.display = "none";
}

function renderCrafts() {
    const grid = document.getElementById("craftGrid");
    const resultInfo = document.getElementById("resultInfo");
    const clearBtn = document.getElementById("clearBtn");

    if (!grid) return;

    if (clearBtn) {
        clearBtn.style.display = searchKeyword ? "block" : "none";
    }

    let list = currentCategory === "ALL"
        ? crafts
        : crafts.filter(c => c.category === currentCategory);

    const keyword = searchKeyword.toLowerCase();

    if (keyword) {
        list = list.filter(c => {
            const itemMaterials = materials.filter(m => m.craft_id === c.id);

            const targetText = [
                c.item_name,
                c.category,
                c.success_rate,
                c.craft_rank,
                c.obtain_place,
                c.note,
                ...itemMaterials.map(m => m.material_name)
            ].join(" ").toLowerCase();

            return targetText.includes(keyword);
        });
    }

    if (resultInfo) {
        const categoryText = currentCategory === "ALL" ? "전체" : currentCategory;
        resultInfo.textContent = `분류: ${categoryText} · 검색 결과 ${list.length}개`;
    }

    if (list.length === 0) {
        grid.innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`;
        return;
    }

    grid.innerHTML = "";

    list.forEach(c => {
        const itemMaterials = materials.filter(m => m.craft_id === c.id);

        const card = document.createElement("div");
        card.className = "card";

        let matHtml = "";

        if (itemMaterials.length > 0) {
            itemMaterials.forEach(m => {
                matHtml += `
                    <div class="material-row">
                        <span>${m.material_name}</span>
                        <span class="qty">x${m.quantity}</span>
                    </div>
                `;
            });
        } else {
            matHtml = `
                <div class="material-row">
                    <span>등록된 재료 없음</span>
                </div>
            `;
        }

        card.innerHTML = `
            <div class="item-name">${c.item_name || "이름 없음"}</div>

            <div class="badges">
                <span class="badge">${c.category || "-"}</span>
                <span class="badge rate">성공률 ${c.success_rate || "-"}%</span>
                <span class="badge rank">랭크 ${c.craft_rank || "-"}</span>
            </div>

            <div class="meta">
                획득처: ${c.obtain_place || "-"}
            </div>

            <div class="materials">
                <div class="material-title">필요 재료</div>
                ${matHtml}
            </div>
        `;

        card.onclick = () => {
            const matBox = card.querySelector(".materials");
            matBox.style.display = matBox.style.display === "block" ? "none" : "block";
        };

        grid.appendChild(card);
    });
}

function showReady(index) {
    setActiveMenu(index);

    document.getElementById("content").innerHTML = `
        <div class="section-head">
            <div class="section-title">준비중</div>
            <div class="section-desc">아직 연결되지 않은 카테고리입니다.</div>
        </div>
        <div class="empty">해당 정보는 추후 추가 예정입니다.</div>
    `;
}
</script>

</body>
</html>
